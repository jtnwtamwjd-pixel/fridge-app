<script>
'use strict';
// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
let NOW=null; // テスト用に日付を差し替え可能
function today(){const d=NOW?new Date(NOW):new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
const WD='日月火水木金土';
function fmtD(s){const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- ingredient DB ----------
const ING={};const ALIAS={};
for(const [name,cat,emoji,fr,fz,rm,def,...al] of ING_RAW){
  ING[name]={name,cat,emoji,days:{冷蔵:fr,冷凍:fz,常温:rm},def};
  ALIAS[name]=name; for(const a of al) ALIAS[a]=name;
}
const ALIAS_KEYS=Object.keys(ALIAS).sort((a,b)=>b.length-a.length);
// 調味料はレシピの「調味料など」の行と名前で照合する（1文字の名前は行頭のみ）
const SEAS_TERMS=ALIAS_KEYS.filter(k=>ING[ALIAS[k]].cat==='調味料');
function seasKeys(line){
  const hit=SEAS_TERMS.filter(t=>t.length>=2?line.includes(t):line.startsWith(t));
  return [...new Set(hit.filter(t=>!hit.some(o=>o!==t&&o.includes(t))).map(t=>ALIAS[t]))];
}
const norm=s=>s.normalize('NFKC').trim();
function findIng(raw){
  const s=norm(raw); if(!s) return null;

// ---------- urgency & suggestion ----------
// 残り日数 → 使いたい度。期限切れ2日超は提案から外す（状態確認を促す）
function urgency(it){
  const d=daysLeft(it); let u;
  if(d<-2) return 0;
  if(d<0) u=3.2; else if(d===0) u=3; else if(d===1) u=2.4; else if(d===2) u=1.8;
  else if(d===3) u=1.4; else if(d<=5) u=1.0; else if(d<=7) u=.7; else if(d<=14) u=.45; else u=.3;
  if(it.storage==='冷凍') u*=.5;
  return u;
}
function itemsByKey(){
  const m={};
  for(const it of S.items){ if(!it.key) continue; if(daysLeft(it)<-2) continue; (m[it.key]||(m[it.key]=[])).push(it) }
  for(const k in m) m[k].sort((a,b)=>urgency(b)-urgency(a));
  return m;
}
// レシピの材料と冷蔵庫の照合
function matchRecipe(r,byKey){
  const used=new Set(); const rows=[]; let missing=0;
  for(const [spec,amt,opt] of r.ing){
    let hit=null;
    for(const k of spec.split('|')){
      for(const it of (byKey[k]||[])) if(!used.has(it.id)){ if(!hit||urgency(it)>urgency(hit)) hit=it; }
    }
    if(hit) used.add(hit.id);
    if(!hit&&!opt) missing++;
    rows.push({spec,amt,opt:!!opt,hit});
  }
  const seas=r.seasK.map(ks=>{let hit=null;for(const k of ks)for(const it of (byKey[k]||[]))if(!used.has(it.id)&&(!hit||urgency(it)>urgency(hit)))hit=it;if(hit)used.add(hit.id);return hit});
  return {rows,missing,used,seas};
}
// 乱数（シード付き）で「別の案」を出す
function rng(seed){let x=seed*2654435761%4294967296||1;return()=>(x=(x*1664525+1013904223)%4294967296)/4294967296}
function recentPenalty(r){
  const t=today();
  for(const h of S.hist){ if(h.rid!==r.id) continue; const d=diffDays(h.date,t); if(d>=0&&d<=2) return 2.5; if(d>=0&&d<=6) return 1 }
  return 0;
}
function scoreRecipe(r,m,usedSoFar,noise){
  let s=0;
  for(const row of m.rows){ if(!row.hit) continue;
    let u=urgency(row.hit); if(usedSoFar.has(row.hit.id)) u*=.15; s+=u*(row.opt?.6:1); }
  for(const it of m.seas){ if(!it) continue; let u=urgency(it); if(usedSoFar.has(it.id)) u*=.15; s+=u*.5 }
  return s - m.missing*3 - recentPenalty(r) + noise;
}
const isQuick=r=>!!r.how||r.time<=15;

const TYPE_LABEL={main:'主菜',side:'副菜',soup:'汁物',one:'丼・麺・ご飯'};
function buildMenu(seed){
  const byKey=itemsByKey(); const rand=rng(seed+1);
  const noise={}; for(const r of ALL) noise[r.id]=seed?rand()*2.2:0;
  const M={}; for(const r of ALL) M[r.id]=matchRecipe(r,byKey);
  const ok=r=>!M[r.id].missing&&M[r.id].rows.some(x=>x.hit&&!x.opt)&&(!S.quick||isQuick(r))&&(MEAL!=='b'||isQuick(r)||r.time<=15);
  const solo=r=>scoreRecipe(r,M[r.id],new Set(),noise[r.id]);
  const pool=(types,n)=>ALL.filter(r=>types.includes(r.type)&&ok(r)).sort((a,b)=>solo(b)-solo(a)).slice(0,n);
  const mains=pool(['main','one'],10), sides=pool(['side'],10), soups=pool(['soup'],6);
  // 組み合わせの価値 = 期限が近い食材を使える度合い − 栄養の偏り − 品数
  const value=list=>{
    const best=new Map(); let s=0;
    for(const r of list){const m=M[r.id]; s+=noise[r.id]-recentPenalty(r);
      for(const x of m.rows) if(x.hit){const u=urgency(x.hit)*(x.opt?.6:1); if(u>(best.get(x.hit.id)||0)) best.set(x.hit.id,u)}
      for(const it of m.seas) if(it){const u=urgency(it)*.5; if(u>(best.get(it.id)||0)) best.set(it.id,u)}}
    for(const u of best.values()) s+=u;
    const maxN=MEAL==='d'?3:2;
    return s-1.1*nutPenalty(menuNut(list))-Math.max(0,list.length-maxN)*(MEAL==='d'?.7:1.2)-(MEAL==='d'&&!list.some(r=>r.type==='soup')?.3:0)+(MEAL==='l'&&list.some(r=>r.type==='one')?.6:0);
  };
  let bestList=[],bv=-1e9;
  for(const mn of (mains.length?mains:[null])) for(const sd of [null,...sides]) for(const sp of [null,...soups]) for(const sd2 of [null,...sides.slice(0,6)]){
    if(sd2&&(!sd||sd2===sd)) continue;
    const list=[mn,sd,sp,sd2].filter(Boolean); if(!list.length) continue;
    const v=value(list); if(v>bv){bv=v;bestList=list}
  }
  const picks=bestList.map(r=>({r,m:M[r.id],slot:r.type}));
  const usedSoFar=new Set(); for(const p of picks){for(const x of p.m.rows) if(x.hit) usedSoFar.add(x.hit.id); for(const it of p.m.seas) if(it) usedSoFar.add(it.id)}
  const ranked=ALL.map(r=>({r,m:M[r.id],s:scoreRecipe(r,M[r.id],new Set(),0)}))
    .filter(x=>x.m.rows.some(y=>y.hit&&!y.opt)).sort((a,b)=>b.s-a.s);
  return {picks,ranked,usedSoFar,nut:picks.length?menuNut(bestList):null};
}

// ---------- 栄養の計算（材料の分量から1人分を概算） ----------
const SEAS_NUT_KEYS=Object.keys(SEAS_NUT).sort((a,b)=>b.length-a.length);
const seasNut=k=>{let v=SEAS_NUT[k];while(typeof v==='string')v=SEAS_NUT[v];return v};
function findSeasNut(name){for(const k of SEAS_NUT_KEYS){if(k.length===1?name.startsWith(k):name.includes(k))return k}return null}
const NUM_RE=/(\d+(?:\.\d+)?)\s*と\s*(\d+)\/(\d+)|(\d+(?:\.\d+)?)\s*\/\s*(\d+)|(\d+(?:\.\d+)?)\s*[〜~-]\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)/;
function numOf(s){const m=s.match(NUM_RE);if(!m)return null;
  if(m[1])return +m[1]+m[2]/m[3]; if(m[4])return m[4]/m[5]; if(m[6])return (+m[6]+ +m[7])/2; return +m[8]}
// 分量の文字列 → グラム
function gramsOf(amt,units,seas){
  const a=norm(amt||'');
  let m=a.match(/(\d+(?:\.\d+)?)\s*kg/i); if(m) return m[1]*1000;
  m=a.match(/(\d+(?:\.\d+)?)\s*(g|グラム|ml|cc)(?![a-z])/i); if(m) return +m[1];
  const tb=units.大||15;
  m=a.match(/大さじ\s*([\d.\/と〜~-]+)?/); if(m) return (m[1]?numOf(m[1])??1:1)*tb;
  m=a.match(/小さじ\s*([\d.\/と〜~-]+)?/); if(m) return (m[1]?numOf(m[1])??1:1)*tb/3;
  m=a.match(/カップ\s*([\d.\/と〜~-]+)?/); if(m) return (m[1]?numOf(m[1])??1:1)*200;
  m=a.match(/([\d.\/と〜~-]+)?\s*(個|本|枚|束|株|パック|袋|玉|丁|切れ|切|かけ|片|缶|房|尾|箱|皿|杯|膳|cm|節)/);
  if(m){const n=m[1]?numOf(m[1])??1:1;const u=units[m[2]]??Object.values(units)[0]??100;return n*u}
  if(/ひとつまみ/.test(a)) return 1;
  if(/少々|少し/.test(a)) return seas?.3:5;
  if(/適量|適宜/.test(a)) return seas?2:10;
  if(/付け合わせ|添え/.test(a)) return 40;
  if(/半分/.test(a)) return .5*(Object.values(units)[0]??100);
  const n=numOf(a); if(n!=null) return n*(Object.values(units)[0]??100);
  return 0;
}
const VEG_EXCL=new Set(['じゃがいも','さつまいも','しょうが','にんにく']);
const NUTC=new WeakMap();
function addNut(t,v,g){const k=g/100;t.kcal+=v[0]*k;t.p+=v[1]*k;t.f+=v[2]*k;t.c+=v[3]*k;t.fib+=v[4]*k;t.salt+=v[5]*k}
const zeroNut=()=>({kcal:0,p:0,f:0,c:0,fib:0,salt:0,veg:0});
function nutOf(r){
  if(NUTC.has(r)) return NUTC.get(r);
  const t=zeroNut();
  for(const [spec,amt] of r.ing){
    let key=spec.startsWith('?')?null:spec.split('|')[0], v=key&&NUT[key];
    if(!v){const sk=findSeasNut(spec.replace(/^\?/,''));v=sk&&seasNut(sk);key=null}
    if(!v) continue;
    const g=gramsOf(amt,v[6],false); addNut(t,v,g);
    if(key&&ING[key]&&(ING[key].cat==='野菜'||ING[key].cat==='きのこ')&&!VEG_EXCL.has(key)) t.veg+=g;
  }
  for(const line of r.seas){
    const raw=norm(line), gIn=raw.match(/(\d+(?:\.\d+)?)\s*(g|ml)(?![a-z])/i);
    const x=splitIngLine(raw.replace(/[（(][^）)]*[）)]/g,' ').replace(/\s+/g,' ').trim());
    const names=/各/.test(x.amt)?x.name.split(/[・、]/):[x.name];
    for(const nm of names){
      const sk=findSeasNut(nm.trim()); if(!sk) continue; const v=seasNut(sk);
      let g=gIn&&names.length===1?+gIn[1]:gramsOf(x.amt.replace('各',''),v[6],true);
      if(sk==='揚げ油') g=15*((numOf(r.ing[0]?.[1]||'')||300)>=100?1:1);
      addNut(t,v,g);
    }
  }
  const sv=parseFloat(norm(r.serv||'').match(/\d+(\.\d+)?/)?.[0])||2;
  for(const k in t) t[k]/=sv;
  NUTC.set(r,t); return t;
}
// 1食あたりの目安（朝25%・昼35%・晩35%）
function nutTarget(ml){
  ml=ml||MEAL;
  const T=(S.nut&&S.nut.kcal)||2000, sh={b:.25,l:.35,d:.35}[ml], meal=T*sh;
  return {kcal:meal,p:meal*.16/4,fLo:meal*.2/9,fHi:meal*.3/9,c:meal*.57/4,salt:ml==='b'?2:T<1900?2.2:2.5,veg:ml==='b'?70:120,fib:Math.round(T/2000*(ml==='b'?5:7))};
}
const riceG=()=>S.nut&&S.nut.rice!=null?S.nut.rice:150;
function menuNut(list){
  const t=zeroNut(); for(const r of list){const n=nutOf(r);for(const k in t)t[k]+=n[k]}
  if(riceG()>0&&!list.some(r=>r.type==='one')) addNut(t,seasNut('ご飯'),riceG());
  return t;
}
function nutPenalty(n){
  const T=nutTarget(); let p=0;
  p+=3.5*Math.abs(n.kcal-T.kcal)/T.kcal;
  p+=2.5*Math.max(0,T.p-n.p)/T.p;
  if(n.f<T.fLo) p+=1.2*(T.fLo-n.f)/T.fLo; if(n.f>T.fHi) p+=2*(n.f-T.fHi)/T.fHi;
  p+=1.5*Math.max(0,n.salt-T.salt);
  p+=1.6*Math.max(0,T.veg-n.veg)/T.veg;
  p+=.8*Math.max(0,T.fib-n.fib)/T.fib;
  return p;
}
function nutComments(n){
  const T=nutTarget(), c=[];
  if(n.kcal>T.kcal*1.2) c.push('カロリー多め'); else if(n.kcal<T.kcal*.8) c.push('カロリー控えめ');
  if(n.p<T.p*.8) c.push('たんぱく質が少なめ（卵・豆腐・納豆をプラスすると◎）');
  if(n.f>T.fHi*1.15) c.push('脂質多め');
  if(n.salt>T.salt) c.push('塩分多め（汁物は半量に）');
  if(n.veg<T.veg*.7) c.push('野菜が少なめ');
  return c.length?c.join('・'):'バランスのよい献立です';
}
function nutGridHTML(n,withTarget){
  const T=nutTarget(), r1=v=>Math.round(v), r10=v=>Math.round(v*10)/10;
  const cells=[['エネルギー',r1(n.kcal)+'kcal',n.kcal/T.kcal],['たんぱく質',r10(n.p)+'g',n.p/T.p],['脂質',r10(n.f)+'g',n.f/T.fHi],
    ['炭水化物',r10(n.c)+'g',n.c/T.c],['食物繊維',r10(n.fib)+'g',n.fib/T.fib],['塩分',r10(n.salt)+'g',n.salt/T.salt],['野菜',r1(n.veg)+'g',n.veg/T.veg]];
  const tg={エネルギー:r1(T.kcal)+'kcal',たんぱく質:r1(T.p)+'g〜',脂質:`${r1(T.fLo)}〜${r1(T.fHi)}g`,炭水化物:r1(T.c)+'g',食物繊維:T.fib+'g〜',塩分:T.salt+'g以下',野菜:T.veg+'g〜'};
  return `<div class="nutg">${cells.map(([k,v,ratio])=>{const over=k==='塩分'||k==='脂質'||k==='エネルギー'?ratio>1.15:false,under=k!=='塩分'&&ratio<.8;

}

function recipeArt(r){
 const n=r.name, seed=[...n].reduce((a,c)=>a+c.charCodeAt(0),0);
 const ell=(x,y,rx,ry,c,rot=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${c}" transform="rotate(${rot} ${x} ${y})"/>`;

function openSheet(title,html,onMount){
  $('#shTitle').textContent=title; $('#shBody').innerHTML=html; $('#shBody').scrollTop=0;
  clearTimeout(closeSheet.t); const sc=$('#scrim'),sh=$('#sheet'); sc.hidden=sh.hidden=false;
  requestAnimationFrame(()=>{sc.classList.add('show');sh.classList.add('show')});
  onMount&&onMount($('#shBody'));
  const cb=document.createElement('button');cb.className='btn ghost block closeb';cb.textContent='閉じる';cb.onclick=closeSheet;$('#shBody').appendChild(cb);
}
function closeSheet(){
  const sc=$('#scrim'),sh=$('#sheet'); sc.classList.remove('show');sh.classList.remove('show');
  closeSheet.t=setTimeout(()=>{sc.hidden=sh.hidden=true},250);
}
$('#scrim').onclick=closeSheet; $('#shX').onclick=closeSheet;
// 見出し部分を下にスワイプしても閉じる
(()=>{const sh=$('#sheet');let y0=null,dy=0;
  const start=e=>{if(e.target.closest('#shX'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`};
  const end=()=>{if(y0==null)return;y0=null;sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet()};
  for(const el of [$('#shHead'),sh.querySelector('.grab')]){el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchmove',move,{passive:true});el.addEventListener('touchend',end)}
})();

      b.querySelector('#custom').hidden=!name||!!key;
      if(!storage) setStg(key?ING[key].def:'冷蔵');
      if(!name){est.textContent='食材名を入れると期限の目安を自動で入れます。';return}
      const c=key?ING[key].cat:cat.value; const d=estDays(key,c,storage);
      const bad=key&&ING[key].days[storage]==null;
      if(!expTouched) exp.value=addDays(bought.value||today(),d);
      const isS=(key?ING[key].cat:c)==='調味料';
      est.innerHTML=(key?`「${esc(key)}」として登録 ・ `:'リストにない食材 ・ ')+`${isS?'開封後、':''}${storage}で<b>約${d}日</b>（${fmtD(exp.value)}まで）`+
        (bad?`<br>⚠️ ${esc(key)}は${storage}保存に向きません`:'')+(expTouched?'<br>期限は手入力の日付を使います':'');
      // 候補
      const ac=b.querySelector('#ac');
      const cand=name?ALIAS_KEYS.filter(k=>k.includes(name)||name.includes(k)).map(k=>ALIAS[k]):[];
      ac.innerHTML=[...new Set(cand)].slice(0,8).map(n=>`<button data-c="${n}">${ING[n].emoji} ${n}</button>`).join('');
      ac.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{nm.value=x.dataset.c;storage=null;recalc()});
    };
    nm.oninput=()=>{storage=null;expTouched=false;recalc()};
    cat.onchange=recalc; bought.onchange=recalc;
    exp.onchange=()=>{expTouched=true;recalc()};
    photoExpiryUI(b.querySelector('#ocrbox'),d=>{exp.value=d;expTouched=true;recalc()});
    b.querySelectorAll('#stg button').forEach(x=>x.onclick=()=>{setStg(x.dataset.s);expTouched=false;recalc()});
    const doAdd=()=>{
      const name=norm(nm.value); if(!name){nm.focus();return}
      const it=addItem({name:key&&name.length<=key.length+6?name:name,key,cat:key?ING[key].cat:cat.value,storage,bought:bought.value||today(),exp:exp.value,amt:norm(b.querySelector('#amt').value)});
      if(expTouched) it.auto=false, save();
      toast(`${name} を追加しました`); nm.value='';b.querySelector('#amt').value='';storage=null;expTouched=false;recalc();render();nm.focus();
    };
    b.querySelector('#add').onclick=doAdd;
    nm.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)doAdd()};
    b.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{
      const k=x.dataset.q, s=ING[k].def; const bd=bought.value||today();
      addItem({name:k,key:k,cat:ING[k].cat,storage:s,bought:bd,exp:addDays(bd,estDays(k,null,s))});
      x.classList.add('added'); toast(`${k} を追加（${s}・約${estDays(k,null,s)}日）`); render();
    });
    // まとめて
    b.querySelectorAll('#mode button').forEach(x=>x.onclick=()=>{b.querySelectorAll('#mode button').forEach(y=>y.classList.toggle('on',y===x));b.querySelector('#one').hidden=x.dataset.m!=='one';b.querySelector('#bulk').hidden=x.dataset.m!=='bulk'});
    const bt=b.querySelector('#bt'),bp=b.querySelector('#bp');
    const parsed=()=>parseBulk(bt.value);
    bt.oninput=()=>{const p=parsed();bp.innerHTML=p.length?p.map(x=>`${x.key?ING[x.key].emoji:'🍱'} ${esc(x.name)}${x.amt?` <small>${esc(x.amt)}</small>`:''} → ${x.storage}・約${x.days}日${x.key?'':'（リスト外）'}`).join('<br>'):'入力すると、ここに読み取り結果が出ます。'};
    b.querySelector('#badd').onclick=()=>{const p=parsed();if(!p.length)return;const bd=b.querySelector('#bb').value||today();
      for(const x of p) addItem({name:x.name,key:x.key,cat:x.cat,storage:x.storage,bought:bd,exp:addDays(bd,x.days),amt:x.amt});
      toast(`${p.length}品を追加しました`);closeSheet();render()};
    if(prefill){nm.value=prefill;}
    recalc();
  });
}
function parseBulk(text){
  const AMT=/^([0-9.\/]+\s*(g|kg|個|本|枚|袋|パック|束|玉|丁|切れ|株|ml|L|缶|房|尾)?|半分|少し)$/;
  const out=[];
  for(const tok of norm(text).split(/[、,，\n・\/\s]+/).map(s=>s.trim()).filter(Boolean)){
    if(AMT.test(tok)&&out.length&&!out[out.length-1].amt){out[out.length-1].amt=tok;continue}
    const m=tok.match(/^(.+?)([0-9.]+\s*(g|kg|個|本|枚|袋|パック|束|玉|丁|切れ|株|ml|L|缶|房|尾)?)$/);
    out.push({name:m?m[1]:tok,amt:m?m[2]:''});
  }
  return out.map(({name,amt})=>{
    const key=findIng(name); const cat=key?ING[key].cat:'その他'; const storage=key?ING[key].def:'冷蔵';
    return {name,amt,key,cat,storage,days:estDays(key,cat,storage)};
  });
}

// ---------- カレンダー（作った料理の記録を朝・昼・晩で振り返る） ----------
const histRecipe=h=>h.rid?ALL.find(x=>x.id===h.rid):null;
const histLabel=h=>{const r=histRecipe(h);return r?r.name:(h.name||'（削除したレシピ）')};
const histEmoji=h=>{const r=histRecipe(h);return r?r.emoji:(h.name?'🍴':'❔')};
function addHist(o){
  S.hist.push({id:uid(),t:Date.now(),...o});
  S.hist.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
  if(S.hist.length>1500) S.hist=S.hist.slice(-1500);
}
let CAL=null;
function renderCal(){
  const el=$('#tab-cal'); const t=parseD(today());
  if(!CAL) CAL={y:t.getFullYear(),m:t.getMonth()};
  const {y,m}=CAL, first=new Date(y,m,1), nd=new Date(y,m+1,0).getDate(), key=d=>`${y}-${pad(m+1)}-${pad(d)}`;
  const byDay={}; for(const h of S.hist){(byDay[h.date]=byDay[h.date]||[]).push(h)}
  let cells=[...WD].map((w,i)=>`<div class="wd" style="${i===0?'color:#d33':i===6?'color:#36c':''}">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++) cells+='<div class="d o"></div>';
  for(let d=1;d<=nd;d++){
    const k=key(d), L=byDay[k]||[], dw=new Date(y,m,d).getDay();
    const slot=ml=>{const x=L.filter(h=>histMeal(h)===ml);return x.length?`<i title="${MEALS[ml]}">${histEmoji(x[0])}</i>`:`<i class="e">・</i>`};
    cells+=`<div class="d ${k===today()?'t':''} ${dw===0?'sun':dw===6?'sat':''}" data-day="${k}"><span class="n">${d}</span>${L.length?`<div class="m">${slot('b')}</div><div class="m">${slot('l')}</div><div class="m">${slot('d')}</div>`:''}</div>`;
  }
  // 月のまとめ
  const mon=S.hist.filter(h=>h.date.startsWith(`${y}-${pad(m+1)}-`));
  const days=new Set(mon.map(h=>h.date)).size, cnt={};
  for(const h of mon){const l=histLabel(h);cnt[l]=(cnt[l]||0)+1}
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const perMeal=Object.keys(MEALS).map(ml=>`${MEALS[ml]} ${mon.filter(h=>histMeal(h)===ml).length}`).join('・');
  el.innerHTML=`<div class="calh"><button class="chip" id="cprev">‹ 前の月</button><h2>${y}年${m+1}月</h2><button class="chip" id="cnext">次の月 ›</button></div>
    <div class="cal">${cells}</div>
    <p class="muted" style="margin:6px 2px">日付をタップすると、その日の朝・昼・晩を見たり追加したりできます。各日の絵文字は上から朝・昼・晩です。</p>
    <h2>${m+1}月のまとめ</h2><div class="card" style="padding:12px 14px">
      ${mon.length?`<div>記録 <b>${mon.length}品</b>（${perMeal}）・記録した日 <b>${days}日</b></div>
      <div class="muted" style="margin-top:8px">よく作った料理</div>${top.map(([n,c])=>`<div class="hist"><span class="grow">${esc(n)}</span><span class="muted">${c}回</span></div>`).join('')}`
      :'<div class="muted">この月の記録はまだありません。レシピの「作った！」か、日付をタップして追加できます。</div>'}
    </div>`;
  $('#cprev').onclick=()=>{CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--}renderCal()};
  $('#cnext').onclick=()=>{CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++}renderCal()};
  el.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day));
}
function openDay(date){
  const L=S.hist.filter(h=>h.date===date);
  const tot=zeroNut(); let any=false;
  for(const h of L){const r=histRecipe(h); if(r){const n=nutOf(r);for(const k in tot)tot[k]+=n[k];any=true}}
  openSheet(fmtD(date)+'のごはん',`
    ${Object.keys(MEALS).map(ml=>{const x=L.filter(h=>histMeal(h)===ml);
      return `<div class="meal-h">${MEAL_EM[ml]} ${MEAL_NAME[ml]}<span class="grow"></span><button class="chip" data-add="${ml}">＋ 追加</button></div>
      ${x.map(h=>{const r=histRecipe(h);return `<div class="rec"><span>${histEmoji(h)}</span><span class="grow" ${r?`data-open="${r.id}" style="text-decoration:underline"`:''}>${esc(histLabel(h))}</span>${r?`<span class="muted">${Math.round(nutOf(r).kcal)}kcal</span>`:''}<button class="x2" data-del="${h.id}">削除</button></div>`}).join('')||'<div class="muted" style="padding:4px 0">記録なし</div>'}`}).join('')}
    ${any?`<h2>この日の合計（レシピ分・1人分の概算）</h2><div class="muted">${Math.round(tot.kcal)}kcal・たんぱく質${Math.round(tot.p)}g・野菜${Math.round(tot.veg)}g・塩分${Math.round(tot.salt*10)/10}g<br>※ご飯やレシピ以外の記録は含みません</div>`:''}
  `,b=>{
    b.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>openAddRecord(date,x.dataset.add));
    b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(!confirm('この記録を削除しますか？'))return;S.hist=S.hist.filter(h=>h.id!==x.dataset.del);save();render();openDay(date)});
    b.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openRecipe(x.dataset.open));
  });
}
function openAddRecord(date,ml){
  openSheet(`${fmtD(date)}の${MEAL_NAME[ml]}を追加`,`
    <input id="arq" type="search" placeholder="料理名で探す（なければそのまま名前で記録）">

      list.innerHTML=(v?'':'<div class="muted" style="margin:2px">最近作ったもの・レシピから選ぶ</div>')+L.map(r=>`<div class="dish" data-pick="${r.id}"><div class="em">${recipeArt(r)}</div><div class="grow"><div class="kind">${TYPE_LABEL[r.type]}・${Math.round(nutOf(r).kcal)}kcal</div><div class="nm">${esc(r.name)}</div></div><div class="go">＋</div></div>`).join('');
      list.querySelectorAll('[data-pick]').forEach(e=>e.onclick=()=>done({rid:e.dataset.pick}));
    };
    q.oninput=draw; fr.onclick=()=>{const v=norm(q.value);if(v)done({rid:null,name:v.slice(0,40)})}; draw();
  });
}

// ---------- マイレシピ（手入力・SNS投稿の貼り付け） ----------
const SEAS_WORDS=/^(塩|砂糖|こしょう|コショウ|胡椒|塩こしょう|塩コショウ|黒こしょう|しょうゆ|醤油|酒|みりん|酢|味噌|みそ|油|サラダ油|ごま油|オリーブオイル|バター|片栗粉|小麦粉|薄力粉|パン粉|水|お湯|だし|顆粒だし|和風だし|白だし|ほんだし|鶏がら|鶏ガラ|コンソメ|ケチャップ|マヨネーズ|ソース|めんつゆ|ポン酢|豆板醤|甜麺醤|コチュジャン|オイスターソース|はちみつ|わさび|からし|ごま|白ごま|すりごま|いりごま|かつお節|鰹節|ラー油|七味|一味|粉チーズ|ナツメグ|カレー粉|カレールウ|シチュールウ|鷹の爪|唐辛子|レモン汁|ご飯|米|揚げ油|おろしにんにく|おろし生姜|にんにくチューブ|生姜チューブ|チューブにんにく|チューブ生姜)/;
const AMT_RE=/(大さじ|小さじ|カップ|[0-9.\/]+\s*(g|kg|ml|cc|L|個|本|枚|袋|パック|束|玉|丁|切れ|株|缶|房|尾|片|かけ|cm|合|杯|膳|粒|尾|切)|少々|適量|適宜|ひとつまみ|少し|お好みで|好みで|1\/2|半分|半量|各)/;
const BULLET=/^[\s・●○◎◆◇■□▪▫★☆✔✓✅☑\-\*•‐－–—>〇♦︎️]+/;
const STEP_NUM=/^\s*(STEP\s*\d+|手順\s*\d+|[①-⑳]|[❶-❿]|[➀-➉]|\(?\d{1,2}[\.．\)）:：、]|[1-9]️⃣)\s*/i;
function stripEmoji(s){return s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{20E3}]/gu,'')}
function guessType(name){
  if(/丼|パスタ|スパゲ|うどん|そば|蕎麦|ラーメン|カレー|チャーハン|炒飯|ご飯|ごはん|ライス|焼きそば|焼そば|雑炊|おにぎり|リゾット|グラタン|ドリア|ピザ|サンド|トースト|麺/.test(name)) return 'one';
  if(/スープ|汁|ポタージュ|ミネストローネ|チャウダー/.test(name)) return 'soup';
  if(/サラダ|和え|あえ|おひたし|ナムル|漬け|きんぴら|マリネ|ピクルス|白和え|煮びたし|浅漬|副菜|ディップ/.test(name)) return 'side';
  return 'main';
}
// 「豚バラ 200g」「・玉ねぎ……1/2個」「醤油：大さじ1」→ {name, amt, opt}
function splitIngLine(line){
  let s=line.replace(BULLET,'').replace(/^[ABC](?=[^\x00-\x7F])|^[ABCabc][\s.:：、)）]+/,'').trim();
  let opt=/お好みで|好みで|あれば|任意|なくても/.test(s);
  s=s.replace(/[（(]\s*(任意|お好みで|あれば|なくても可|なくてもOK)\s*[)）]/g,'').trim();
  let m=s.match(/^(.+?)\s*(?:[…‥・\.．:：]{1,}|\s+|\t)\s*(.+)$/);
  let name,amt;
  if(m&&AMT_RE.test(m[2])){name=m[1];amt=m[2]}
  else{const i=s.search(AMT_RE); if(i>0){name=s.slice(0,i);amt=s.slice(i)} else {name=s;amt=''}}
  name=name.replace(/[…‥:：\s・]+$/,'').replace(/^[A-ZＡ-Ｚa-z][\s.:：、)]\s*/,'').trim();
  return {name,amt:amt.trim(),opt};
}
function isSeasoningName(name){
  const k=findIng(name); if(k) return ING[k].cat==='調味料';
  return SEAS_WORDS.test(name);
}
// SNS投稿などのテキストをレシピの形にする（推測なので保存前に確認してもらう）
function parseRecipeText(text){
  // ①❶➀ は NFKC で数字だけになるので、先に「1. 」の形にしておく
  const raw=norm(text.replace(/[①-⑳]/g,c=>(c.charCodeAt(0)-0x245F)+'. ').replace(/[❶-❿]/g,c=>(c.charCodeAt(0)-0x2775)+'. ').replace(/[➀-➉]/g,c=>(c.charCodeAt(0)-0x277F)+'. '));
  const url=(raw.match(/https?:\/\/\S+/)||[''])[0];
  const lines=raw.replace(/https?:\/\/\S+/g,'').split(/\n/).map(l=>stripEmoji(l).replace(/#[^\s#]+/g,'').trim());
  let mode=null,title='',serv='',ings=[],seas=[],steps=[],other=[];
  const H_ING=/^[【\[［<〈《〔(（■□●◆◇★☆\s]*(材料|食材|用意するもの|ingredients)/i;
  const H_STEP=/^[【\[［<〈《〔(（■□●◆◇★☆\s]*(作り方|つくり方|手順|調理方法|作りかた|how\s*to|レシピ手順)/i;
  const H_SEAS=/^[【\[［<〈《〔(（■□●◆◇★☆\s]*(調味料|合わせ調味料|タレ|たれ|ソース|[AＡBＢ][\s】\]］:：)）]|[AＡBＢ]$)/;
  for(const l of lines){
    if(!l){continue}
    const sv=l.match(/([0-9０-９]+)\s*人(分|前)/); if(sv&&!serv) serv=sv[1]+'人分';
    if(H_ING.test(l)&&l.length<30){mode='ing';continue}
    if(H_STEP.test(l)&&l.length<30){mode='step';continue}
    if(mode==='ing'&&H_SEAS.test(l)&&!AMT_RE.test(l.replace(H_SEAS,''))){mode='seas';continue}
    if(mode==='seas'&&H_STEP.test(l)){mode='step';continue}
    if(STEP_NUM.test(l)&&(mode==='step'||(!mode&&l.length>12)||(mode&&mode!=='step'&&l.replace(STEP_NUM,'').length>14))){mode='step'}
    if(mode==='step'){const t=l.replace(STEP_NUM,'').replace(BULLET,'').trim(); if(t.length>=2){
        // 番号のない行は直前の手順の続きとして扱う
        if(!STEP_NUM.test(l)&&steps.length&&!/。$/.test(steps[steps.length-1])&&t.length<40) steps[steps.length-1]+=t; else steps.push(t)} continue}
    if(mode==='ing'||mode==='seas'||(!mode&&AMT_RE.test(l)&&l.length<40)){
      const x=splitIngLine(l); if(!x.name||x.name.length>20){other.push(l);continue}
      const k=findIng(x.name), isS=isSeasoningName(x.name);
      if(isS||(mode==='seas'&&!(k&&ING[k].cat!=='調味料'))) seas.push(x); else ings.push(x);
      if(!mode) mode='ing';
      continue;
    }
    if(!title&&l.length<=40&&!/保存|フォロー|いいね|コメント|プロフィール/.test(l)) {title=l.replace(/\\[^\/]*\//g,'').replace(/[【】\[\]「」『』]/g,' ').replace(/\s+/g,' ').trim();continue}
    other.push(l);
  }
  if(!steps.length) steps=other.filter(l=>l.length>15&&/[るたすて。]$/.test(l));
  const tm=raw.match(/(?:調理時間|所要時間|作業時間|時間)\s*[:：]?\s*約?\s*([0-9]+)\s*分/);
  title=title.replace(/(の)?(簡単|絶品|悪魔の|無限|やみつき|爆速|節約)?レシピ$/,'').trim()||'マイレシピ';
  return {name:title.slice(0,40),type:guessType(title),time:tm?Math.min(180,+tm[1]):20,serv,ings,seas:seas.map(x=>(x.name+' '+x.amt).trim()),steps,src:url};
}
// フォームの1行 →  レシピの材料 [照合キー, 分量, 任意, 表示名]
function ingFromLine(line){
  const x=splitIngLine(line); if(!x.name) return null;
  const key=findIng(x.name);
  if(key&&ING[key].cat!=='調味料') return [key,x.amt,x.opt?1:0,x.name];
  return ['?'+x.name,x.amt,1,x.name];
}
function lineFromIng(i){return ((i[3]||i[0].replace(/^\?/,'').split('|')[0])+' '+(i[1]||'')).trim()+(i[2]&&!i[0].startsWith('?')?'（任意）':'')}
function openRecipeEditor(r,fromPaste){
  const isNew=!r||!r.mine;
  const base=r||{name:'',type:'main',time:20,serv:'',ing:[],seas:[],steps:[],src:''};
  const ingText=base.ings?base.ings.map(x=>(x.name+' '+x.amt).trim()+(x.opt?'（任意）':'')).join('\n'):base.ing.map(lineFromIng).join('\n');
  openSheet(isNew?'レシピを追加':'レシピを編集',`
    ${isNew&&!fromPaste?`<div class="seg" id="emode"><button class="on" data-m="paste">投稿を貼り付け</button><button data-m="form">自分で書く</button></div>
    <div id="pastebox">
      <label class="f">InstagramやTikTok、YouTube、Xなどの投稿文（キャプション・概要欄）をそのまま貼り付け。送られてきた共有リンクもここに貼れます。</label>
      <textarea id="pt" rows="9" placeholder="例）&#10;やみつき豚バラ大根&#10;【材料】2人分&#10;・豚バラ 200g&#10;・大根 1/3本&#10;A 醤油 大さじ2&#10;A みりん 大さじ2&#10;【作り方】&#10;①大根を切ってレンジで5分&#10;②豚バラを炒めて…"></textarea>
      <button class="btn block" id="pparse" style="margin-top:10px">読み取る</button>
      <p class="muted">動画そのものは読み込めないので、説明文に材料や作り方が書いてある投稿で使えます。読み取った内容は次の画面で直せます。</p>
    </div>`:''}
    <div id="formbox" ${isNew&&!fromPaste?'hidden':''}>
      ${fromPaste?'<div class="estim">読み取った結果です。違うところを直してから保存してください。</div>':''}
      <label class="f">料理名</label><input id="rn" value="${esc(base.name)}" placeholder="例：豚バラ大根">
      <button class="btn ghost block" id="rguess" style="margin-top:8px">✨ 料理名から材料・作り方を下書き</button>
      <div class="muted" id="rguessmsg" style="margin-top:4px">料理名を入れると、材料や作り方を大まかに埋めます。あとは自由に直してください。</div>
      <label class="f">種類</label><div class="seg" id="rt">${Object.entries(TYPE_LABEL).map(([k,v])=>`<button data-t="${k}" class="${base.type===k?'on':''}">${v.replace('・ご飯','')}</button>`).join('')}</div>
      <div class="row"><div class="grow"><label class="f">調理時間（分）</label><input id="rtm" type="number" inputmode="numeric" value="${base.time||20}"></div>
      <div class="grow"><label class="f">何人分</label><input id="rsv" value="${esc(base.serv||'')}" placeholder="2人分"></div></div>
      <label class="f">材料（1行に1つ。「豚バラ 200g」のように。なくてもいいものは「（任意）」）</label>
      <textarea id="ri" rows="6" placeholder="豚バラ 200g&#10;大根 1/3本&#10;青ねぎ 少々（任意）">${esc(ingText)}</textarea>
      <div class="estim" id="rimatch"></div>
      <label class="f">調味料（1行に1つ）</label>
      <textarea id="rs" rows="4" placeholder="醤油 大さじ2&#10;みりん 大さじ2">${esc(base.seas.join('\n'))}</textarea>
      <label class="f">作り方（1行に1手順）</label>
      <textarea id="rp" rows="7" placeholder="大根を切ってレンジで5分加熱する&#10;豚バラを炒める">${esc(base.steps.join('\n'))}</textarea>
      <label class="f">元の投稿・動画のURL（任意）</label><input id="ru" type="url" value="${esc(base.src||'')}" placeholder="https://">
      <button class="btn block" id="rsave" style="margin-top:16px">保存する</button>
    </div>`,b=>{
    let type=base.type||'main';
    b.querySelectorAll('#rt button').forEach(x=>x.onclick=()=>{type=x.dataset.t;b.querySelectorAll('#rt button').forEach(y=>y.classList.toggle('on',y===x))});
    b.querySelectorAll('#emode button').forEach(x=>x.onclick=()=>{b.querySelectorAll('#emode button').forEach(y=>y.classList.toggle('on',y===x));b.querySelector('#pastebox').hidden=x.dataset.m!=='paste';b.querySelector('#formbox').hidden=x.dataset.m==='paste'});
    const pp=b.querySelector('#pparse'); if(pp) pp.onclick=async()=>{const t=b.querySelector('#pt').value; if(!t.trim()){toast('投稿文を貼り付けてください');return}
      if(/#r=[zj]/.test(t)){try{const l=await readShare(t);if(l&&l.length){openImport(l);return}}catch(e){} toast('共有リンクを読み込めませんでした');return}
      const r2=parseRecipeText(t); if(!r2.ings.length&&!r2.steps.length){toast('材料や作り方が見つかりませんでした');}
      openRecipeEditor(r2,true)};
    const ri=b.querySelector('#ri'),rim=b.querySelector('#rimatch');
    const showMatch=()=>{const L=ri.value.split('\n').map(ingFromLine).filter(Boolean);
      rim.innerHTML=L.length?'冷蔵庫と照合：'+L.map(i=>i[0].startsWith('?')?`<span class="muted">${esc(i[3])}（照合なし）</span>`:`<b>${esc(i[0])}</b>${i[2]?'（任意）':''}`).join('、'):'材料を書くと、冷蔵庫のどの食材と照合するかがここに出ます。'};
    ri.oninput=showMatch; showMatch();
    const rn=b.querySelector('#rn'),gb=b.querySelector('#rguess'),gm=b.querySelector('#rguessmsg');
    const isBlank=()=>!ri.value.trim()&&!b.querySelector('#rp').value.trim()&&!b.querySelector('#rs').value.trim();
    const fill=d=>{
      if(d.type&&TYPE_LABEL[d.type]){type=d.type;b.querySelectorAll('#rt button').forEach(y=>y.classList.toggle('on',y.dataset.t===type))}
      if(d.time) b.querySelector('#rtm').value=d.time;
      if(d.serv) b.querySelector('#rsv').value=d.serv;
      ri.value=d.ings.join('\n'); b.querySelector('#rs').value=d.seas.join('\n'); b.querySelector('#rp').value=d.steps.join('\n');
      showMatch();
    };
    const guess=async auto=>{
      const name=norm(rn.value); if(!name){if(!auto)toast('先に料理名を入れてください');return}
      if(!isBlank()&&!(auto||confirm('いま入っている材料・調味料・作り方を下書きで置き換えますか？')))return;
      if(!isBlank()&&auto) return;
      gb.disabled=true; gm.textContent='考え中…';
      try{
        const d=await draftRecipe(name);
        if(!d){gm.innerHTML='似たレシピが見つかりませんでした。「その他 → AI画像認識」でGeminiのキーを設定すると、どんな料理名でも下書きできます。';return}
        fill(d); gm.textContent=d.from?`「${d.from}」をもとに下書きしました。分量や手順は好みに合わせて直してください。`:'AIが大まかに下書きしました。分量や手順は好みに合わせて直してください。';
      }catch(e){gm.textContent='下書きできませんでした：'+e.message}
      finally{gb.disabled=false}
    };
    gb.onclick=()=>guess(false);
    if(isNew) rn.addEventListener('change',()=>{if(isBlank())guess(true)});
    b.querySelector('#rsave').onclick=()=>{
      const name=norm(b.querySelector('#rn').value); if(!name){toast('料理名を入れてください');b.querySelector('#rn').focus();return}
      const lines=id=>b.querySelector(id).value.split('\n').map(s=>s.replace(STEP_NUM,'').replace(BULLET,'').trim()).filter(Boolean);
      const rec={id:(r&&r.mine)?r.id:'u_'+uid(),t:(r&&r.mine&&r.t)||Date.now(),mine:true,name,type,emoji:{main:'🍽️',side:'🥗',soup:'🥣',one:'🍚'}[type],
        time:Math.max(1,parseInt(b.querySelector('#rtm').value)||20),serv:norm(b.querySelector('#rsv').value),
        ing:b.querySelector('#ri').value.split('\n').map(ingFromLine).filter(Boolean),
        seas:lines('#rs'),steps:lines('#rp'),src:norm(b.querySelector('#ru').value)};
      S.my=S.my||[]; const i=S.my.findIndex(x=>x.id===rec.id); if(i>=0) S.my[i]=rec; else S.my.push(rec);
      save(); refreshRecipes(); toast('レシピを保存しました'); RT='mine'; TAB='recipes'; render(); openRecipe(rec.id);
    };
  });
}

// ---------- 料理名から下書き（AIキーがあればGemini、なければ手持ちのレシピから似たものを探す） ----------
function bigramSim(a,b){
  a=a.replace(/\s/g,'');b=b.replace(/\s/g,''); if(!a||!b) return 0; if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .6+.4*Math.min(a.length,b.length)/Math.max(a.length,b.length);
  const g=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);m.set(k,(m.get(k)||0)+1)}return m};
  const A=g(a),B=g(b);let n=0;A.forEach((v,k)=>{n+=Math.min(v,B.get(k)||0)});
  return 2*n/Math.max(1,(a.length-1)+(b.length-1));
}
function localDraft(name){
  let best=null,bs=0;
  for(const r of ALL){const sc=bigramSim(name,r.name);if(sc>bs){bs=sc;best=r}}
  if(!best||bs<.45) return null;
  return {from:best.name,type:best.type,time:best.time,serv:best.serv||'2人分',ings:best.ing.map(lineFromIng),seas:[...best.seas],steps:[...best.steps]};
}
async function draftRecipe(name){
  if(!aiOn()) return localDraft(name);
  const r=await askText(`家庭料理「${name}」の一般的なレシピを2人分で考えてください。日本の家庭で手に入る材料で、分量は「200g」「1/2個」「大さじ1」のように書いてください。なくてもよい材料は opt を true に。調味料（醤油・みりん・塩など）は ings ではなく seas に入れてください。type は main(主菜) side(副菜) soup(汁物) one(丼・麺・ご飯もの) のどれか。JSONのみで {"type":"main","time":20,"serv":"2人分","ings":[{"name":"豚バラ肉","amt":"200g","opt":false}],"seas":["醤油 大さじ2"],"steps":["手順1","手順2"]} の形で答えてください。`);
  const ings=(r.ings||[]).filter(x=>x&&x.name).map(x=>(String(x.name)+' '+String(x.amt||'')).trim()+(x.opt?'（任意）':''));
  if(!ings.length&&!(r.steps||[]).length) return localDraft(name);
  return {type:r.type,time:parseInt(r.time)||0,serv:String(r.serv||'2人分'),ings,seas:(r.seas||[]).map(String),steps:(r.steps||[]).map(x=>String(x).replace(STEP_NUM,''))};
}

// ---------- レシピの共有（データをリンクの # 以降に入れて送る。サーバーは使わない） ----------
const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}};
async function pipe(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer())}
const packRecipe=r=>({n:r.name,t:r.type,m:r.time,v:r.serv||'',i:r.ing.map(x=>[x[3]||x[0].replace(/^\?/,''),x[1]||'',x[2]?1:0]),s:r.seas,p:r.steps,u:r.src||''});
function unpackRecipe(o){
  const type=TYPE_LABEL[o.t]?o.t:'main';
  return {id:'u_'+uid(),t:Date.now(),mine:true,name:String(o.n||'レシピ').slice(0,60),type,emoji:{main:'🍽️',side:'🥗',soup:'🥣',one:'🍚'}[type],time:+o.m||20,serv:String(o.v||''),
    ing:(o.i||[]).map(([n,a,opt])=>{const x=ingFromLine(String(n)+' '+String(a||''));if(!x)return null;if(opt)x[2]=1;return x}).filter(Boolean),
    seas:(o.s||[]).map(String),steps:(o.p||[]).map(String),src:/^https?:\/\//.test(o.u||'')?o.u:''};
}
async function shareURL(recipes){
  const u8=new TextEncoder().encode(JSON.stringify(recipes.map(packRecipe)));
  let code;
  try{code='z'+b64u.enc(await pipe(u8,new CompressionStream('deflate-raw')))}catch(e){code='j'+b64u.enc(u8)}
  return location.href.split('#')[0]+'#r='+code;
}
async function readShare(str){
  const m=String(str).match(/#r=([zj])([A-Za-z0-9_-]+)/); if(!m) return null;
  let u8=b64u.dec(m[2]); if(m[1]==='z') u8=await pipe(u8,new DecompressionStream('deflate-raw'));
  const arr=JSON.parse(new TextDecoder().decode(u8)); return Array.isArray(arr)?arr.map(unpackRecipe):null;
}
async function shareRecipes(recipes){
  const url=await shareURL(recipes);
  const title=recipes.length===1?`レシピ「${recipes[0].name}」`:`マイレシピ ${recipes.length}品`;
  if(navigator.share){try{await navigator.share({title,text:title+'（冷蔵庫ごはん）',url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('共有リンクをコピーしました');return}catch(e){}
  openSheet('共有リンク',`<p class="muted">このリンクをコピーして送ってください。</p><textarea rows="6" readonly>${esc(url)}</textarea>`,b=>{const t=b.querySelector('textarea');t.focus();t.select()});
}

const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
let tessWorker=null;
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('読み込み失敗'));document.head.appendChild(s)})}
async function getTess(onProg){
  if(tessWorker) return tessWorker;

  tessWorker=await Tesseract.createWorker('eng',1,{logger:m=>{if(onProg&&m.status)onProg(m)}});

// 画像を縮小・白黒にして文字を読みやすくする
function prepImage(file,invert){
  return new Promise((ok,ng)=>{const img=new Image();img.onload=()=>{
    const k=Math.min(1,1800/Math.max(img.width,img.height)), w=Math.round(img.width*k), h=Math.round(img.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
    const d=g.getImageData(0,0,w,h),p=d.data;let mn=255,mx=0;
    for(let i=0;i<p.length;i+=4){const v=.3*p[i]+.59*p[i+1]+.11*p[i+2];p[i]=v;if(v<mn)mn=v;if(v>mx)mx=v}
    const sc=255/Math.max(1,mx-mn);
    for(let i=0;i<p.length;i+=4){let v=(p[i]-mn)*sc;if(invert)v=255-v;p[i]=p[i+1]=p[i+2]=v}
    g.putImageData(d,0,0);URL.revokeObjectURL(img.src);ok(c)};img.onerror=ng;img.src=URL.createObjectURL(file)});
}
// 読み取った文字から日付の候補を探す（2026.11.03 / 26.11.03 / 2026年11月3日 / 11.03 など）
function findDates(text){
  const t=norm(text).replace(/[oO]/g,'0').replace(/[lI|]/g,'1');
  const now=parseD(today()), out=new Map();
  const add=(y,m,d,full)=>{
    if(m<1||m>12||d<1||d>31) return;
    if(y<100) y+=2000;
    const dt=new Date(y,m-1,d); if(dt.getMonth()!==m-1) return;
    const diff=(dt-now)/864e5; if(diff<-60||diff>365*3) return;
    const s=`${y}-${pad(m)}-${pad(d)}`; if(!out.has(s)||full) out.set(s,{date:s,full});
  };
  let m;
  const R1=/(20\d{2})\s*[.\/\-年]\s*(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})/g;
  while((m=R1.exec(t))) add(+m[1],+m[2],+m[3],true);
  const R1b=/(20\d{2})\s(\d{1,2})\s(\d{1,2})(?!\d)/g; while((m=R1b.exec(t))) add(+m[1],+m[2],+m[3],true);
  const R1c=/(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)/g; while((m=R1c.exec(t))) add(+m[1],+m[2],+m[3],true);
  const R2=/(?<!\d)(\d{2})\s*[.\/\-]\s*(\d{1,2})\s*[.\/\-]\s*(\d{1,2})(?!\d)/g; while((m=R2.exec(t))) add(+m[1],+m[2],+m[3],true);
  if(!out.size){const R3=/(?<!\d)(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})(?!\d)/g;
    while((m=R3.exec(t))){let y=now.getFullYear();const dt=new Date(y,+m[1]-1,+m[2]);if((dt-now)/864e5<-60)y++;add(y,+m[1],+m[2],false)}}
  return [...out.values()].sort((a,b)=>(b.full-a.full)||a.date.localeCompare(b.date));
}
async function readExpiryFromPhoto(file,onStatus){
  onStatus('文字認識の準備中…（初回は数秒かかります）');
  const w=await getTess(m=>{if(m.status==='recognizing text')onStatus(`読み取り中… ${Math.round(m.progress*100)}%`)});
  let all='';
  for(const inv of [false,true]){
    const c=await prepImage(file,inv); const r=await w.recognize(c); all+='\n'+r.data.text;
    if(findDates(all).length) break;
  }
  return {dates:findDates(all),text:all.trim()};
}

async function askGemini(parts,temperature){
  const body=JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature}});
  let res,j,lastErr;
  for(const m of GEMINI_MODELS){
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),20000);
    try{
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':AI.key},body});
      j=await res.json().catch(()=>({}));
    }catch(e){ res=null; lastErr=e; }
    clearTimeout(to);
    // 混雑(503/500)・上限(429)・タイムアウト・モデル無し(404)のときは軽量モデルで再挑戦
    if(res&&res.ok) break;
    if(res&&![429,500,503,404].includes(res.status)) break;
  }
  if(!res) throw new Error(lastErr&&lastErr.name==='AbortError'?'AIの応答がありませんでした。もう一度試してください':'通信できませんでした');
  if(res.status===402) throw new Error('Geminiのプロジェクトのクレジットが残っていません（AI Studioで支払い設定を確認してください）');
  if(res.status===429) throw new Error('無料枠の上限に達しました。少し時間をおいて試してください');
  if(res.status===503||res.status===500) throw new Error('AIが混み合っています。少し時間をおいて試してください');
  if(res.status===400||res.status===403) throw new Error('APIキーが使えません（キーを確認してください）');
  if(!res.ok) throw new Error(j.error&&j.error.message||('HTTP '+res.status));
  const t=j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(p=>p.text||'').join('');
  return JSON.parse(String(t).replace(/^```json|```$/g,'').trim());
}

    for(const col of Object.keys(SYNC_COLS)){
      const pendingLocal=SYNC_COLS[col].get().map(o=>({...o}));
      SY.unsub.push(fb.onSnapshot(fb.collection(db,'homes',SY.code,col),snap=>{
        const map={}; snap.forEach(d=>{map[d.id]=d.data()});
        SY.remote[col]=Object.fromEntries(Object.entries(map).map(([k,v])=>{const c={...v};delete c.id;return [k,stableStr(c)]}));
        if(!SY.ready[col]){
          SY.ready[col]=true;
          // 参加時に「この端末のデータも追加」を選んだら、手元にしかないものを足す
          if(SY.merge) for(const o of pendingLocal) if(o.id&&!map[o.id]) map[o.id]=cleanDoc(col,o);
        }
        for(const k in map) map[k]=fromDoc(col,{...map[k]});
        applyRemote(col,map);
        if(col==='recipes') refreshRecipes();
        if(Object.keys(SYNC_COLS).every(c=>SY.ready[c])){
          if(SY.status!=='on'){SY.status='on'; if(SY.merge){SY.merge=false;saveSync()}}
          saveLocal(); syncPush();
        }
        render();
      },e=>syncFail(e)));
    }
  }catch(e){syncFail(e)}
}
function syncFail(e){
  console.error(e); SY.status='error';
  SY.err=/permission/i.test(String(e&&(e.code||e.message)))?'読み書きが許可されていません（Firestoreのルールか匿名ログインの設定を確認してください）':
    (navigator.onLine===false?'オフラインです':'接続できませんでした：'+String(e&&(e.code||e.message)||e).slice(0,80));
  renderSyncBits();
}
function syncStop(keepCode){
  for(const u of SY.unsub) try{u()}catch(e){}
  SY.unsub=[]; SY.status='off'; SY.ready={};
  if(!keepCode){SY.code=null;saveSync()}
}
// 手元とクラウドの差分だけを書き込む
function syncPush(){
  if(!syncOn()||!SY.db) return;
  const fb=SY.fb; let batch=fb.writeBatch(SY.db), n=0; const commits=[];
  const put=(fn)=>{fn(batch); if(++n>=450){commits.push(batch.commit());batch=fb.writeBatch(SY.db);n=0}};
  for(const col of Object.keys(SYNC_COLS)){
    const local={};
    for(const o of SYNC_COLS[col].get()){ if(!o.id) o.id=uid(); const d=cleanDoc(col,o); delete d.id; local[o.id]=[stableStr(d),d] }
    const remote=SY.remote[col];
    for(const [id,[j,d]] of Object.entries(local)) if(remote[id]!==j){ const ref=fb.doc(SY.db,'homes',SY.code,col,id); put(b=>b.set(ref,d)); remote[id]=j }
    for(const id of Object.keys(remote)) if(!(id in local)){ const ref=fb.doc(SY.db,'homes',SY.code,col,id); put(b=>b.delete(ref)); delete remote[id] }
  }
  if(n) commits.push(batch.commit());
  Promise.all(commits).catch(syncFail);
}

function parseFbConfig(t){
  const o={}; for(const m of String(t).matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g)) o[m[1]]=m[2];
  return o.apiKey&&o.projectId&&o.appId?o:null;
}

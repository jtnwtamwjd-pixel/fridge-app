<style>
/* Layout: header with today's date, one scrolling panel per tab, bottom tab bar. Bottom sheets for add / recipe / item actions. */
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#2b2a26; --muted:#7a766b; --line:#e6e0d2;
  --green:#2f7d5b; --green-2:#e3f1e9; --red:#d2473a; --red-2:#fbe5e1; --orange:#e08a1e; --orange-2:#fcefd9;
  --yellow:#c9a400; --blue:#3a76b5; --blue-2:#e2eef9; --shadow:0 2px 10px rgba(60,50,20,.08);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1c1a; --card:#242724; --ink:#ecebe5; --muted:#a3a197; --line:#363a35;
  --green:#5fbf8f; --green-2:#203a2d; --red:#ff7b6c; --red-2:#3d2422; --orange:#f2a640; --orange-2:#3b2e1a;
  --blue:#7fb2e8; --blue-2:#1f2d3c; --shadow:0 2px 10px rgba(0,0,0,.3); color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.04em}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--green);font-weight:900}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:18px 2px 8px;font-weight:900}
h2:first-child{margin-top:4px}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--green);color:#fff;font-size:15px}
.btn.sub{background:var(--green-2);color:var(--green)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--red-2);color:var(--red)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(47,125,91,.45)}
/* fridge list */
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5}
.alert.red{background:var(--red-2);color:var(--red)}
.alert.orange{background:var(--orange-2);color:var(--orange)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .em{font-size:26px;width:36px;text-align:center;flex:none}
.item .nm{font-weight:700;font-size:15px}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{flex:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.b-exp{background:var(--red);color:#fff}
.b-0,.b-1{background:var(--red-2);color:var(--red)}
.b-2,.b-3{background:var(--orange-2);color:var(--orange)}

.st{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--bg);color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-size:48px}
/* menu */
.dish{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.dish:last-child{border-bottom:0}
.dish .em{font-size:34px;width:46px;height:46px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.dish .kind{font-size:11px;color:var(--green);font-weight:900}
.dish .nm{font-weight:900;font-size:16px;margin:1px 0 3px}
.dish .why{font-size:12px;color:var(--muted);line-height:1.5}
.dish .go{margin-left:auto;color:var(--muted);font-size:20px;align-self:center}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin:2px 3px 0 0}
.tag.u{background:var(--red-2);color:var(--red)}
.tag.h{background:var(--green-2);color:var(--green)}
.tag.m{background:var(--orange-2);color:var(--orange)}
.cover{font-size:13px;margin-top:8px;line-height:1.6}
.rlist .dish{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px;border:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.show{transform:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h3{margin:0;font-size:17px;font-weight:900;flex:1}
.sheet .x{border:0;background:var(--bg);width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.sheet .sb{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:700}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:900;color:var(--green)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px}
.estim{background:var(--green-2);color:var(--green);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.5}
.quick h4{font-size:12px;color:var(--muted);margin:14px 0 6px}
.quick .sugg button.added{background:var(--green);color:#fff;border-color:var(--green)}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ings li .q{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.mk{width:22px;text-align:center;flex:none;font-weight:900}
.mk.ok{color:var(--green)} .mk.ng{color:var(--orange)} .mk.op{color:var(--muted)}
.seas{font-size:13px;line-height:1.8;color:var(--muted)}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 36px;line-height:1.65;font-size:15px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
ol.steps li.done{opacity:.4;text-decoration:line-through}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.rhead .em{font-size:44px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none;accent-color:var(--green)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hist{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.hist:last-child{border-bottom:0}
</style></head>
<body>
<header><h1>🧊 冷蔵庫ごはん</h1><div class="sub" id="hdrSub"></div></header>
<main>
  <section id="tab-fridge"></section>
  <section id="tab-menu" hidden></section>
  <section id="tab-recipes" hidden></section>
  <section id="tab-more" hidden></section>
</main>
<button class="fab" id="fab" aria-label="食材を追加">＋</button>
<nav class="tabs">
  <button data-tab="fridge" class="on"><span class="i">🧊</span>冷蔵庫</button>
  <button data-tab="menu"><span class="i">🍽️</span>今日の献立</button>
  <button data-tab="recipes"><span class="i">📖</span>レシピ</button>
  <button data-tab="more"><span class="i">⚙️</span>その他</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sh"><h3 id="shTitle"></h3><button class="x" id="shX" aria-label="閉じる">✕</button></div><div class="sb" id="shBody"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
let NOW=null; // テスト用に日付を差し替え可能
function today(){const d=NOW?new Date(NOW):new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
const WD='日月火水木金土';
function fmtD(s){const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- ingredient DB ----------
const ING={};const ALIAS={};
for(const [name,cat,emoji,fr,fz,rm,def,...al] of ING_RAW){
  ING[name]={name,cat,emoji,days:{冷蔵:fr,冷凍:fz,常温:rm},def};
  ALIAS[name]=name; for(const a of al) ALIAS[a]=name;
}
const ALIAS_KEYS=Object.keys(ALIAS).sort((a,b)=>b.length-a.length);
const norm=s=>s.normalize('NFKC').trim();
function findIng(raw){
  const s=norm(raw); if(!s) return null;
  if(ALIAS[s]) return ALIAS[s];
  for(const k of ALIAS_KEYS) if(k.length>=2 && s.includes(k)) return ALIAS[k];
  return null;
}
// 推定日数: DBにあればその保存場所の日数、なければ分類の既定値
function estDays(key,cat,storage){
  const g=key&&ING[key];
  if(g){const d=g.days[storage]; if(d!=null) return d;
    // 指定場所が不向きなら一番近い値
    return g.days.冷蔵??g.days.常温??g.days.冷凍??7}
  if(storage==='冷凍') return 30;
  return CAT_DAYS[cat]??7;
}

// ---------- state ----------
const LS='fridge_app_v1';
let S={items:[],hist:[],seed:0};
try{const j=JSON.parse(localStorage.getItem(LS)||'null'); if(j&&Array.isArray(j.items)) S=Object.assign(S,j)}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function daysLeft(it){return diffDays(today(),it.exp)}
function itemOf(id){return S.items.find(i=>i.id===id)}
function addItem({name,key,cat,storage,bought,exp,amt}){
  const g=key&&ING[key];
  const it={id:uid(),name:name||key,key:key||null,cat:cat||(g?g.cat:'その他'),emoji:g?g.emoji:'🍱',
    storage,bought,exp,amt:amt||'',auto:true};
  S.items.push(it); save(); return it;
}

// ---------- urgency & suggestion ----------
// 残り日数 → 使いたい度。期限切れ2日超は提案から外す（状態確認を促す）
function urgency(it){
  const d=daysLeft(it); let u;
  if(d<-2) return 0;
  if(d<0) u=3.2; else if(d===0) u=3; else if(d===1) u=2.4; else if(d===2) u=1.8;
  else if(d===3) u=1.4; else if(d<=5) u=1.0; else if(d<=7) u=.7; else if(d<=14) u=.45; else u=.3;
  if(it.storage==='冷凍') u*=.5;
  return u;
}
function itemsByKey(){
  const m={};
  for(const it of S.items){ if(!it.key) continue; if(daysLeft(it)<-2) continue; (m[it.key]||(m[it.key]=[])).push(it) }
  for(const k in m) m[k].sort((a,b)=>urgency(b)-urgency(a));
  return m;
}
// レシピの材料と冷蔵庫の照合
function matchRecipe(r,byKey){
  const used=new Set(); const rows=[]; let missing=0;
  for(const [spec,amt,opt] of r.ing){
    let hit=null;
    for(const k of spec.split('|')){
      for(const it of (byKey[k]||[])) if(!used.has(it.id)){ if(!hit||urgency(it)>urgency(hit)) hit=it; }
    }
    if(hit) used.add(hit.id);
    if(!hit&&!opt) missing++;
    rows.push({spec,amt,opt:!!opt,hit});
  }
  return {rows,missing,used};
}
// 乱数（シード付き）で「別の案」を出す
function rng(seed){let x=seed*2654435761%4294967296||1;return()=>(x=(x*1664525+1013904223)%4294967296)/4294967296}
function recentPenalty(r){
  const t=today();
  for(const h of S.hist){ if(h.rid!==r.id) continue; const d=diffDays(h.date,t); if(d>=0&&d<=2) return 2.5; if(d>=0&&d<=6) return 1 }
  return 0;
}
function scoreRecipe(r,m,usedSoFar,noise){
  let s=0;
  for(const row of m.rows){ if(!row.hit) continue;
    let u=urgency(row.hit); if(usedSoFar.has(row.hit.id)) u*=.15; s+=u*(row.opt?.6:1); }
  return s - m.missing*3 - recentPenalty(r) + noise;
}
const TYPE_LABEL={main:'主菜',side:'副菜',soup:'汁物',one:'丼・麺・ご飯'};
function buildMenu(seed){
  const byKey=itemsByKey(); const rand=rng(seed+1);
  const noise={}; for(const r of RECIPES) noise[r.id]=seed?rand()*1.6:0;
  const M={}; for(const r of RECIPES) M[r.id]=matchRecipe(r,byKey);
  const usedSoFar=new Set(); const picks=[];
  const pick=(types,needUse)=>{
    let best=null,bs=-1e9;
    for(const r of RECIPES){ if(!types.includes(r.type)) continue; const m=M[r.id]; if(m.missing) continue;
      if(needUse&&!m.rows.some(x=>x.hit&&!x.opt)) continue;
      if(picks.some(p=>p.r.id===r.id)) continue;
      const s=scoreRecipe(r,m,usedSoFar,noise[r.id]); if(s>bs){bs=s;best=r} }
    if(best){ picks.push({r:best,m:M[best.id],slot:best.type}); for(const x of M[best.id].rows) if(x.hit) usedSoFar.add(x.hit.id) }
    return best;
  };
  const main=pick(['main','one'],true);
  pick(['side'],true);
  // 丼ものの日は汁物、主菜の日も汁物。使える汁物がなければ省略
  pick(['soup'],true);
  // まだ期限が近い食材が残るなら副菜をもう1品
  const left=S.items.filter(it=>!usedSoFar.has(it.id)&&it.key&&daysLeft(it)<=1&&daysLeft(it)>=-2&&it.storage!=='冷凍');
  if(left.length) pick(['side','soup'],true);
  // ランキング（あと1品で作れるものも含む）
  const ranked=RECIPES.map(r=>({r,m:M[r.id],s:scoreRecipe(r,M[r.id],new Set(),0)}))
    .filter(x=>x.m.rows.some(y=>y.hit&&!y.opt)).sort((a,b)=>b.s-a.s);
  return {picks,ranked,usedSoFar};
}

// ---------- rendering ----------
let TAB='fridge', FILTER='all';
function render(){
  const urgent=S.items.filter(it=>daysLeft(it)<=1).length;
  $('#hdrSub').textContent=`${fmtD(today())}　食材 ${S.items.length}品`+(urgent?`・早めに使いたい ${urgent}品`:'');
  for(const t of ['fridge','menu','recipes','more']) $('#tab-'+t).hidden=t!==TAB;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  $('#fab').hidden=!(TAB==='fridge'||TAB==='menu');
  ({fridge:renderFridge,menu:renderMenu,recipes:renderRecipes,more:renderMore})[TAB]();
}
function badge(it){
  const d=daysLeft(it);
  if(it.storage==='冷凍'&&d>3) return `<span class="badge b-frz">❄ あと${d}日</span>`;
  if(d<0) return `<span class="badge b-exp">${-d}日過ぎ</span>`;
  if(d===0) return `<span class="badge b-0">今日まで</span>`;
  if(d<=3) return `<span class="badge b-${d}">あと${d}日</span>`;
  return `<span class="badge b-ok">あと${d}日</span>`;
}
function renderFridge(){
  const el=$('#tab-fridge');
  if(!S.items.length){
    el.innerHTML=`<div class="empty"><div class="big">🧊</div><p>冷蔵庫はまだ空です。<br>右下の「＋」から食材を登録しましょう。</p>
      <p class="muted">名前を入れると保管期限の目安を自動で入れます。</p>
      <button class="btn sub" id="demo">お試し用の食材を入れてみる</button></div>`;
    $('#demo').onclick=loadDemo; return;
  }
  const items=[...S.items].sort((a,b)=>daysLeft(a)-daysLeft(b));
  const expired=items.filter(it=>daysLeft(it)<0), soon=items.filter(it=>{const d=daysLeft(it);return d>=0&&d<=1});
  let h='';
  if(expired.length) h+=`<div class="alert red">⚠️ 期限の目安を過ぎた食材：${expired.map(i=>esc(i.name)).join('、')}<br><small>においや見た目を確認して、大丈夫なら今日使いましょう。</small></div>`;
  if(soon.length) h+=`<div class="alert orange">⏰ 今日・明日中に使いたい：${soon.map(i=>esc(i.name)).join('、')}　<a href="#" id="toMenu" style="color:inherit;font-weight:900">献立を見る ›</a></div>`;
  const places=['all','冷蔵','冷凍','常温'];
  h+=`<div class="filters">${places.map(p=>`<button class="chip ${FILTER===p?'on':''}" data-f="${p}">${p==='all'?'すべて':p}（${p==='all'?items.length:items.filter(i=>i.storage===p).length}）</button>`).join('')}</div>`;
  const list=items.filter(i=>FILTER==='all'||i.storage===FILTER);
  h+=`<div class="card" style="padding:4px 12px">`+(list.length?list.map(it=>`
    <div class="item" data-id="${it.id}">
      <div class="em">${it.emoji}</div>
      <div class="grow"><div class="nm">${esc(it.name)}${it.amt?` <span class="muted">${esc(it.amt)}</span>`:''}</div>
      <div class="meta"><span class="st">${it.storage}</span>${fmtD(it.exp)}まで${it.auto?'（目安）':''}</div></div>
      ${badge(it)}

function parseBulk(text){
  const AMT=/^([0-9.\/]+\s*(g|kg|個|本|枚|袋|パック|束|玉|丁|切れ|株|ml|L|缶|房|尾)?|半分|少し)$/;
  const out=[];
  for(const tok of norm(text).split(/[、,，\n・\/\s]+/).map(s=>s.trim()).filter(Boolean)){
    if(AMT.test(tok)&&out.length&&!out[out.length-1].amt){out[out.length-1].amt=tok;continue}
    const m=tok.match(/^(.+?)([0-9.]+\s*(g|kg|個|本|枚|袋|パック|束|玉|丁|切れ|株|ml|L|缶|房|尾)?)$/);
    out.push({name:m?m[1]:tok,amt:m?m[2]:''});
  }
  return out.map(({name,amt})=>{
    const key=findIng(name); const cat=key?ING[key].cat:'その他'; const storage=key?ING[key].def:'冷蔵';
    return {name,amt,key,cat,storage,days:estDays(key,cat,storage)};
  });
}

  openSheet('使った食材',`

    ${used.map(x=>`<label class="check"><input type="checkbox" data-id="${x.hit.id}" checked><span>${x.hit.emoji} ${esc(x.hit.name)}${x.hit.amt?` <span class="muted">${esc(x.hit.amt)}</span>`:''}</span></label>`).join('')||'<p class="muted">冷蔵庫の食材は使っていません。</p>'}
    <button class="btn block" id="ok" style="margin-top:16px">記録する</button>`,b=>{
    b.querySelector('#ok').onclick=()=>{
      const ids=[...b.querySelectorAll('input:checked')].map(i=>i.dataset.id);
      S.items=S.items.filter(it=>!ids.includes(it.id));
      S.hist.push({rid:r.id,date:today()}); if(S.hist.length>200) S.hist=S.hist.slice(-200);
      S.seed=0; save(); closeSheet(); toast(`${r.name} を記録しました`); render();
    };
  });
}

<style>
/* Simple layout: plain header, one list per tab, bottom tab bar. Sheets open full height from the top so the close button never hides under the keyboard. */
:root{
  --bg:#ffffff; --soft:#f4f5f3; --ink:#1f2321; --muted:#7b817d; --line:#e7e9e6;
  --accent:#2f7d5b; --accent-2:#e9f3ee; --red:#d0453a; --red-2:#fcecea; --orange:#c7761a; --orange-2:#fdf3e6; --blue:#3a76b5;
  --font:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151716; --soft:#1f2220; --ink:#ecedeb; --muted:#9aa09c; --line:#2c302d;
  --accent:#62c191; --accent-2:#1c2e25; --red:#ff7d70; --red-2:#341f1d; --orange:#f0a64a; --orange-2:#33281a; --blue:#83b5ea; color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12px;color:var(--muted);margin-top:2px}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:12px 0 14px;font-size:13px;color:var(--muted)}
nav.tabs button .i{display:none}
nav.tabs button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
.card{border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:12px}

h2:first-child{margin-top:6px}

.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--accent);color:#fff;font-size:15px;min-height:46px}
.btn.sub{background:var(--soft);color:var(--ink)}

.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

.sheet .sb{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .closeb{margin-top:20px}
label.f{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 0;font-size:14px;color:var(--muted)}

.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px}
.estim{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;line-height:1.55}
.quick details{border-top:1px solid var(--line);margin-top:6px}
.quick summary{padding:13px 0;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.quick summary::after{content:'＋';color:var(--muted)}
.quick details[open] summary::after{content:'－'}
.quick summary::-webkit-details-marker{display:none}
.quick .sugg{margin:0 0 12px}
.quick .sugg button.added{background:var(--accent);color:#fff;border-color:var(--accent)}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ings li .q{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.mk{width:18px;text-align:center;flex:none;font-weight:700}
.mk.ok{color:var(--accent)} .mk.ng{color:var(--orange)} .mk.op{color:var(--muted)}
.seas{list-style:none;padding:0;margin:0;font-size:14px}
.seas li{padding:6px 0;color:var(--muted)}
.seas li.has{color:var(--ink)}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 32px;line-height:1.7;font-size:15px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}
ol.steps li.done{opacity:.35;text-decoration:line-through}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.rhead .em{font-size:36px}
.check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hist{font-size:14px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.hist:last-child{border-bottom:0}
</style></head>
<body>
<header><h1>冷蔵庫ごはん</h1><div class="sub" id="hdrSub"></div></header>
<main>
  <section id="tab-fridge"></section>
  <section id="tab-menu" hidden></section>
  <section id="tab-recipes" hidden></section>
  <section id="tab-more" hidden></section>
</main>
<button class="fab" id="fab" aria-label="食材を追加">＋ 追加</button>
<nav class="tabs">
  <button data-tab="fridge" class="on"><span class="i">🧊</span>冷蔵庫</button>
  <button data-tab="menu"><span class="i">🍽️</span>今日の献立</button>
  <button data-tab="recipes"><span class="i">📖</span>レシピ</button>
  <button data-tab="more"><span class="i">⚙️</span>その他</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden><div class="grab"></div><div class="sh" id="shHead"><h3 id="shTitle"></h3><button class="x" id="shX">✕ 閉じる</button></div><div class="sb" id="shBody"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
let NOW=null; // テスト用に日付を差し替え可能
function today(){const d=NOW?new Date(NOW):new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
const WD='日月火水木金土';
function fmtD(s){const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- ingredient DB ----------
const ING={};const ALIAS={};
for(const [name,cat,emoji,fr,fz,rm,def,...al] of ING_RAW){
  ING[name]={name,cat,emoji,days:{冷蔵:fr,冷凍:fz,常温:rm},def};
  ALIAS[name]=name; for(const a of al) ALIAS[a]=name;
}
const ALIAS_KEYS=Object.keys(ALIAS).sort((a,b)=>b.length-a.length);
// 調味料はレシピの「調味料など」の行と名前で照合する（1文字の名前は行頭のみ）
const SEAS_TERMS=ALIAS_KEYS.filter(k=>ING[ALIAS[k]].cat==='調味料');
function seasKeys(line){
  const hit=SEAS_TERMS.filter(t=>t.length>=2?line.includes(t):line.startsWith(t));
  return [...new Set(hit.filter(t=>!hit.some(o=>o!==t&&o.includes(t))).map(t=>ALIAS[t]))];
}
const norm=s=>s.normalize('NFKC').trim();
function findIng(raw){
  const s=norm(raw); if(!s) return null;
  if(ALIAS[s]) return ALIAS[s];
  for(const k of ALIAS_KEYS) if(k.length>=2 && s.includes(k)) return ALIAS[k];
  return null;
}
// 推定日数: DBにあればその保存場所の日数、なければ分類の既定値
function estDays(key,cat,storage){
  const g=key&&ING[key];
  if(g){const d=g.days[storage]; if(d!=null) return d;
    // 指定場所が不向きなら一番近い値
    return g.days.冷蔵??g.days.常温??g.days.冷凍??7}
  if(storage==='冷凍') return 30;
  return CAT_DAYS[cat]??7;
}

// ---------- state ----------
const LS='fridge_app_v1';
let S={items:[],hist:[],seed:0,my:[]};
try{const j=JSON.parse(localStorage.getItem(LS)||'null'); if(j&&Array.isArray(j.items)) S=Object.assign(S,j)}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(){saveLocal(); if(typeof syncPush==='function') syncPush()}
// 標準レシピ＋マイレシピ
let ALL=[];
function refreshRecipes(){ALL=[...(S.my||[]),...RECIPES];for(const r of ALL) r.seasK=r.seas.map(seasKeys)}
refreshRecipes();

function daysLeft(it){return diffDays(today(),it.exp)}
function itemOf(id){return S.items.find(i=>i.id===id)}
function addItem({name,key,cat,storage,bought,exp,amt}){
  const g=key&&ING[key];
  const it={id:uid(),name:name||key,key:key||null,cat:cat||(g?g.cat:'その他'),emoji:g?g.emoji:'🍱',
    storage,bought,exp,amt:amt||'',auto:true};
  S.items.push(it); save(); return it;
}

// ---------- urgency & suggestion ----------
// 残り日数 → 使いたい度。期限切れ2日超は提案から外す（状態確認を促す）
function urgency(it){
  const d=daysLeft(it); let u;
  if(d<-2) return 0;
  if(d<0) u=3.2; else if(d===0) u=3; else if(d===1) u=2.4; else if(d===2) u=1.8;
  else if(d===3) u=1.4; else if(d<=5) u=1.0; else if(d<=7) u=.7; else if(d<=14) u=.45; else u=.3;
  if(it.storage==='冷凍') u*=.5;
  return u;
}
function itemsByKey(){
  const m={};
  for(const it of S.items){ if(!it.key) continue; if(daysLeft(it)<-2) continue; (m[it.key]||(m[it.key]=[])).push(it) }
  for(const k in m) m[k].sort((a,b)=>urgency(b)-urgency(a));
  return m;
}
// レシピの材料と冷蔵庫の照合
function matchRecipe(r,byKey){
  const used=new Set(); const rows=[]; let missing=0;
  for(const [spec,amt,opt] of r.ing){
    let hit=null;
    for(const k of spec.split('|')){
      for(const it of (byKey[k]||[])) if(!used.has(it.id)){ if(!hit||urgency(it)>urgency(hit)) hit=it; }
    }
    if(hit) used.add(hit.id);
    if(!hit&&!opt) missing++;
    rows.push({spec,amt,opt:!!opt,hit});
  }
  const seas=r.seasK.map(ks=>{let hit=null;for(const k of ks)for(const it of (byKey[k]||[]))if(!used.has(it.id)&&(!hit||urgency(it)>urgency(hit)))hit=it;if(hit)used.add(hit.id);return hit});
  return {rows,missing,used,seas};
}
// 乱数（シード付き）で「別の案」を出す
function rng(seed){let x=seed*2654435761%4294967296||1;return()=>(x=(x*1664525+1013904223)%4294967296)/4294967296}
function recentPenalty(r){
  const t=today();
  for(const h of S.hist){ if(h.rid!==r.id) continue; const d=diffDays(h.date,t); if(d>=0&&d<=2) return 2.5; if(d>=0&&d<=6) return 1 }
  return 0;
}
function scoreRecipe(r,m,usedSoFar,noise){
  let s=0;
  for(const row of m.rows){ if(!row.hit) continue;
    let u=urgency(row.hit); if(usedSoFar.has(row.hit.id)) u*=.15; s+=u*(row.opt?.6:1); }
  for(const it of m.seas){ if(!it) continue; let u=urgency(it); if(usedSoFar.has(it.id)) u*=.15; s+=u*.5 }
  return s - m.missing*3 - recentPenalty(r) + noise;
}
const TYPE_LABEL={main:'主菜',side:'副菜',soup:'汁物',one:'丼・麺・ご飯'};
function buildMenu(seed){
  const byKey=itemsByKey(); const rand=rng(seed+1);
  const noise={}; for(const r of ALL) noise[r.id]=seed?rand()*1.6:0;
  const M={}; for(const r of ALL) M[r.id]=matchRecipe(r,byKey);
  const usedSoFar=new Set(); const picks=[];
  const pick=(types,needUse)=>{
    let best=null,bs=-1e9;
    for(const r of ALL){ if(!types.includes(r.type)) continue; const m=M[r.id]; if(m.missing) continue;
      if(needUse&&!m.rows.some(x=>x.hit&&!x.opt)) continue;
      if(picks.some(p=>p.r.id===r.id)) continue;
      const s=scoreRecipe(r,m,usedSoFar,noise[r.id]); if(s>bs){bs=s;best=r} }
    if(best){ picks.push({r:best,m:M[best.id],slot:best.type}); for(const x of M[best.id].rows) if(x.hit) usedSoFar.add(x.hit.id); for(const it of M[best.id].seas) if(it) usedSoFar.add(it.id) }
    return best;
  };
  const main=pick(['main','one'],true);
  pick(['side'],true);
  // 丼ものの日は汁物、主菜の日も汁物。使える汁物がなければ省略
  pick(['soup'],true);
  // まだ期限が近い食材が残るなら副菜をもう1品
  const left=S.items.filter(it=>!usedSoFar.has(it.id)&&it.key&&daysLeft(it)<=1&&daysLeft(it)>=-2&&it.storage!=='冷凍');
  if(left.length) pick(['side','soup'],true);
  // ランキング（あと1品で作れるものも含む）
  const ranked=ALL.map(r=>({r,m:M[r.id],s:scoreRecipe(r,M[r.id],new Set(),0)}))
    .filter(x=>x.m.rows.some(y=>y.hit&&!y.opt)).sort((a,b)=>b.s-a.s);
  return {picks,ranked,usedSoFar};
}

// ---------- rendering ----------
let TAB='fridge', FILTER='all';
function render(){
  const urgent=S.items.filter(it=>daysLeft(it)<=1).length;
  $('#hdrSub').textContent=`${fmtD(today())}　食材 ${S.items.length}品`+(urgent?`・早めに使いたい ${urgent}品`:'')+syncLabel();
  for(const t of ['fridge','menu','recipes','more']) $('#tab-'+t).hidden=t!==TAB;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  $('#fab').hidden=!(TAB==='fridge'||TAB==='menu');
  ({fridge:renderFridge,menu:renderMenu,recipes:renderRecipes,more:renderMore})[TAB]();
}
function badge(it){
  const d=daysLeft(it);
  if(it.storage==='冷凍'&&d>3) return `<span class="badge b-frz">❄ あと${d}日</span>`;
  if(d<0) return `<span class="badge b-exp">${-d}日過ぎ</span>`;
  if(d===0) return `<span class="badge b-0">今日まで</span>`;
  if(d<=3) return `<span class="badge b-${d}">あと${d}日</span>`;
  return `<span class="badge b-ok">あと${d}日</span>`;
}
function renderFridge(){
  const el=$('#tab-fridge');
  if(!S.items.length){
    el.innerHTML=`<div class="empty"><div class="big">🧊</div><p>冷蔵庫はまだ空です。<br>右下の「＋」から食材を登録しましょう。</p>
      <p class="muted">名前を入れると保管期限の目安を自動で入れます。</p>
      <button class="btn sub" id="demo">お試し用の食材を入れてみる</button></div>`;
    $('#demo').onclick=loadDemo; return;
  }
  const items=[...S.items].sort((a,b)=>daysLeft(a)-daysLeft(b));
  const expired=items.filter(it=>daysLeft(it)<0), soon=items.filter(it=>{const d=daysLeft(it);return d>=0&&d<=1});
  let h='';
  if(expired.length) h+=`<div class="alert red">⚠️ 期限の目安を過ぎた食材：${expired.map(i=>esc(i.name)).join('、')}<br><small>においや見た目を確認して、大丈夫なら今日使いましょう。</small></div>`;

function parseBulk(text){
  const AMT=/^([0-9.\/]+\s*(g|kg|個|本|枚|袋|パック|束|玉|丁|切れ|株|ml|L|缶|房|尾)?|半分|少し)$/;
  const out=[];
  for(const tok of norm(text).split(/[、,，\n・\/\s]+/).map(s=>s.trim()).filter(Boolean)){
    if(AMT.test(tok)&&out.length&&!out[out.length-1].amt){out[out.length-1].amt=tok;continue}
    const m=tok.match(/^(.+?)([0-9.]+\s*(g|kg|個|本|枚|袋|パック|束|玉|丁|切れ|株|ml|L|缶|房|尾)?)$/);
    out.push({name:m?m[1]:tok,amt:m?m[2]:''});
  }
  return out.map(({name,amt})=>{
    const key=findIng(name); const cat=key?ING[key].cat:'その他'; const storage=key?ING[key].def:'冷蔵';
    return {name,amt,key,cat,storage,days:estDays(key,cat,storage)};
  });
}

// ---------- マイレシピ（手入力・SNS投稿の貼り付け） ----------
const SEAS_WORDS=/^(塩|砂糖|こしょう|コショウ|胡椒|塩こしょう|塩コショウ|黒こしょう|しょうゆ|醤油|酒|みりん|酢|味噌|みそ|油|サラダ油|ごま油|オリーブオイル|バター|片栗粉|小麦粉|薄力粉|パン粉|水|お湯|だし|顆粒だし|和風だし|白だし|ほんだし|鶏がら|鶏ガラ|コンソメ|ケチャップ|マヨネーズ|ソース|めんつゆ|ポン酢|豆板醤|甜麺醤|コチュジャン|オイスターソース|はちみつ|わさび|からし|ごま|白ごま|すりごま|いりごま|かつお節|鰹節|ラー油|七味|一味|粉チーズ|ナツメグ|カレー粉|カレールウ|シチュールウ|鷹の爪|唐辛子|レモン汁|ご飯|米|揚げ油|おろしにんにく|おろし生姜|にんにくチューブ|生姜チューブ|チューブにんにく|チューブ生姜)/;
const AMT_RE=/(大さじ|小さじ|カップ|[0-9.\/]+\s*(g|kg|ml|cc|L|個|本|枚|袋|パック|束|玉|丁|切れ|株|缶|房|尾|片|かけ|cm|合|杯|膳|粒|尾|切)|少々|適量|適宜|ひとつまみ|少し|お好みで|好みで|1\/2|半分|半量|各)/;
const BULLET=/^[\s・●○◎◆◇■□▪▫★☆✔✓✅☑\-\*•‐－–—>〇♦︎️]+/;
const STEP_NUM=/^\s*(STEP\s*\d+|手順\s*\d+|[①-⑳]|[❶-❿]|[➀-➉]|\(?\d{1,2}[\.．\)）:：、]|[1-9]️⃣)\s*/i;
function stripEmoji(s){return s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{20E3}]/gu,'')}
function guessType(name){
  if(/丼|パスタ|スパゲ|うどん|そば|蕎麦|ラーメン|カレー|チャーハン|炒飯|ご飯|ごはん|ライス|焼きそば|焼そば|雑炊|おにぎり|リゾット|グラタン|ドリア|ピザ|サンド|トースト|麺/.test(name)) return 'one';
  if(/スープ|汁|ポタージュ|ミネストローネ|チャウダー/.test(name)) return 'soup';
  if(/サラダ|和え|あえ|おひたし|ナムル|漬け|きんぴら|マリネ|ピクルス|白和え|煮びたし|浅漬|副菜|ディップ/.test(name)) return 'side';
  return 'main';
}
// 「豚バラ 200g」「・玉ねぎ……1/2個」「醤油：大さじ1」→ {name, amt, opt}
function splitIngLine(line){
  let s=line.replace(BULLET,'').replace(/^[ABC](?=[^\x00-\x7F])|^[ABCabc][\s.:：、)）]+/,'').trim();
  let opt=/お好みで|好みで|あれば|任意|なくても/.test(s);
  s=s.replace(/[（(]\s*(任意|お好みで|あれば|なくても可|なくてもOK)\s*[)）]/g,'').trim();
  let m=s.match(/^(.+?)\s*(?:[…‥・\.．:：]{1,}|\s+|\t)\s*(.+)$/);
  let name,amt;
  if(m&&AMT_RE.test(m[2])){name=m[1];amt=m[2]}
  else{const i=s.search(AMT_RE); if(i>0){name=s.slice(0,i);amt=s.slice(i)} else {name=s;amt=''}}
  name=name.replace(/[…‥:：\s・]+$/,'').replace(/^[A-ZＡ-Ｚa-z][\s.:：、)]\s*/,'').trim();
  return {name,amt:amt.trim(),opt};
}
function isSeasoningName(name){
  const k=findIng(name); if(k) return ING[k].cat==='調味料';
  return SEAS_WORDS.test(name);
}
// SNS投稿などのテキストをレシピの形にする（推測なので保存前に確認してもらう）
function parseRecipeText(text){
  // ①❶➀ は NFKC で数字だけになるので、先に「1. 」の形にしておく
  const raw=norm(text.replace(/[①-⑳]/g,c=>(c.charCodeAt(0)-0x245F)+'. ').replace(/[❶-❿]/g,c=>(c.charCodeAt(0)-0x2775)+'. ').replace(/[➀-➉]/g,c=>(c.charCodeAt(0)-0x277F)+'. '));
  const url=(raw.match(/https?:\/\/\S+/)||[''])[0];
  const lines=raw.replace(/https?:\/\/\S+/g,'').split(/\n/).map(l=>stripEmoji(l).replace(/#[^\s#]+/g,'').trim());
  let mode=null,title='',serv='',ings=[],seas=[],steps=[],other=[];
  const H_ING=/^[【\[［<〈《〔(（■□●◆◇★☆\s]*(材料|食材|用意するもの|ingredients)/i;
  const H_STEP=/^[【\[［<〈《〔(（■□●◆◇★☆\s]*(作り方|つくり方|手順|調理方法|作りかた|how\s*to|レシピ手順)/i;
  const H_SEAS=/^[【\[［<〈《〔(（■□●◆◇★☆\s]*(調味料|合わせ調味料|タレ|たれ|ソース|[AＡBＢ][\s】\]］:：)）]|[AＡBＢ]$)/;
  for(const l of lines){
    if(!l){continue}
    const sv=l.match(/([0-9０-９]+)\s*人(分|前)/); if(sv&&!serv) serv=sv[1]+'人分';
    if(H_ING.test(l)&&l.length<30){mode='ing';continue}
    if(H_STEP.test(l)&&l.length<30){mode='step';continue}
    if(mode==='ing'&&H_SEAS.test(l)&&!AMT_RE.test(l.replace(H_SEAS,''))){mode='seas';continue}
    if(mode==='seas'&&H_STEP.test(l)){mode='step';continue}
    if(STEP_NUM.test(l)&&(mode==='step'||(!mode&&l.length>12)||(mode&&mode!=='step'&&l.replace(STEP_NUM,'').length>14))){mode='step'}
    if(mode==='step'){const t=l.replace(STEP_NUM,'').replace(BULLET,'').trim(); if(t.length>=2){
        // 番号のない行は直前の手順の続きとして扱う
        if(!STEP_NUM.test(l)&&steps.length&&!/。$/.test(steps[steps.length-1])&&t.length<40) steps[steps.length-1]+=t; else steps.push(t)} continue}
    if(mode==='ing'||mode==='seas'||(!mode&&AMT_RE.test(l)&&l.length<40)){
      const x=splitIngLine(l); if(!x.name||x.name.length>20){other.push(l);continue}
      const k=findIng(x.name), isS=isSeasoningName(x.name);
      if(isS||(mode==='seas'&&!(k&&ING[k].cat!=='調味料'))) seas.push(x); else ings.push(x);
      if(!mode) mode='ing';
      continue;
    }
    if(!title&&l.length<=40&&!/保存|フォロー|いいね|コメント|プロフィール/.test(l)) {title=l.replace(/\\[^\/]*\//g,'').replace(/[【】\[\]「」『』]/g,' ').replace(/\s+/g,' ').trim();continue}
    other.push(l);
  }
  if(!steps.length) steps=other.filter(l=>l.length>15&&/[るたすて。]$/.test(l));
  const tm=raw.match(/(?:調理時間|所要時間|作業時間|時間)\s*[:：]?\s*約?\s*([0-9]+)\s*分/);
  title=title.replace(/(の)?(簡単|絶品|悪魔の|無限|やみつき|爆速|節約)?レシピ$/,'').trim()||'マイレシピ';
  return {name:title.slice(0,40),type:guessType(title),time:tm?Math.min(180,+tm[1]):20,serv,ings,seas:seas.map(x=>(x.name+' '+x.amt).trim()),steps,src:url};
}
// フォームの1行 →  レシピの材料 [照合キー, 分量, 任意, 表示名]
function ingFromLine(line){
  const x=splitIngLine(line); if(!x.name) return null;
  const key=findIng(x.name);
  if(key&&ING[key].cat!=='調味料') return [key,x.amt,x.opt?1:0,x.name];
  return ['?'+x.name,x.amt,1,x.name];
}
function lineFromIng(i){return ((i[3]||i[0].replace(/^\?/,'').split('|')[0])+' '+(i[1]||'')).trim()+(i[2]&&!i[0].startsWith('?')?'（任意）':'')}
function openRecipeEditor(r,fromPaste){
  const isNew=!r||!r.mine;
  const base=r||{name:'',type:'main',time:20,serv:'',ing:[],seas:[],steps:[],src:''};

  openSheet(isNew?'レシピを追加':'レシピを編集',`
    ${isNew&&!fromPaste?`<div class="seg" id="emode"><button class="on" data-m="paste">投稿を貼り付け</button><button data-m="form">自分で書く</button></div>

      <textarea id="pt" rows="9" placeholder="例）&#10;やみつき豚バラ大根&#10;【材料】2人分&#10;・豚バラ 200g&#10;・大根 1/3本&#10;A 醤油 大さじ2&#10;A みりん 大さじ2&#10;【作り方】&#10;①大根を切ってレンジで5分&#10;②豚バラを炒めて…"></textarea>

      <p class="muted">動画そのものは読み込めないので、説明文に材料や作り方が書いてある投稿で使えます。読み取った内容は次の画面で直せます。</p>
    </div>`:''}
    <div id="formbox" ${isNew&&!fromPaste?'hidden':''}>
      ${fromPaste?'<div class="estim">読み取った結果です。違うところを直してから保存してください。</div>':''}
      <label class="f">料理名</label><input id="rn" value="${esc(base.name)}" placeholder="例：豚バラ大根">
      <label class="f">種類</label><div class="seg" id="rt">${Object.entries(TYPE_LABEL).map(([k,v])=>`<button data-t="${k}" class="${base.type===k?'on':''}">${v.replace('・ご飯','')}</button>`).join('')}</div>
      <div class="row"><div class="grow"><label class="f">調理時間（分）</label><input id="rtm" type="number" inputmode="numeric" value="${base.time||20}"></div>

      <label class="f">材料（1行に1つ。「豚バラ 200g」のように。なくてもいいものは「（任意）」）</label>
      <textarea id="ri" rows="6" placeholder="豚バラ 200g&#10;大根 1/3本&#10;青ねぎ 少々（任意）">${esc(ingText)}</textarea>
      <div class="estim" id="rimatch"></div>
      <label class="f">調味料（1行に1つ）</label>
      <textarea id="rs" rows="4" placeholder="醤油 大さじ2&#10;みりん 大さじ2">${esc(base.seas.join('\n'))}</textarea>
      <label class="f">作り方（1行に1手順）</label>
      <textarea id="rp" rows="7" placeholder="大根を切ってレンジで5分加熱する&#10;豚バラを炒める">${esc(base.steps.join('\n'))}</textarea>
      <label class="f">元の投稿・動画のURL（任意）</label><input id="ru" type="url" value="${esc(base.src||'')}" placeholder="https://">
      <button class="btn block" id="rsave" style="margin-top:16px">保存する</button>
    </div>`,b=>{
    let type=base.type||'main';
    b.querySelectorAll('#rt button').forEach(x=>x.onclick=()=>{type=x.dataset.t;b.querySelectorAll('#rt button').forEach(y=>y.classList.toggle('on',y===x))});
    b.querySelectorAll('#emode button').forEach(x=>x.onclick=()=>{b.querySelectorAll('#emode button').forEach(y=>y.classList.toggle('on',y===x));b.querySelector('#pastebox').hidden=x.dataset.m!=='paste';b.querySelector('#formbox').hidden=x.dataset.m==='paste'});
    const pp=b.querySelector('#pparse'); if(pp) pp.onclick=async()=>{const t=b.querySelector('#pt').value; if(!t.trim()){toast('投稿文を貼り付けてください');return}
      if(/#r=[zj]/.test(t)){try{const l=await readShare(t);if(l&&l.length){openImport(l);return}}catch(e){} toast('共有リンクを読み込めませんでした');return}
      const r2=parseRecipeText(t); if(!r2.ings.length&&!r2.steps.length){toast('材料や作り方が見つかりませんでした');}

    ri.oninput=showMatch; showMatch();
    b.querySelector('#rsave').onclick=()=>{
      const name=norm(b.querySelector('#rn').value); if(!name){toast('料理名を入れてください');b.querySelector('#rn').focus();return}
      const lines=id=>b.querySelector(id).value.split('\n').map(s=>s.replace(STEP_NUM,'').replace(BULLET,'').trim()).filter(Boolean);
      const rec={id:(r&&r.mine)?r.id:'u_'+uid(),t:(r&&r.mine&&r.t)||Date.now(),mine:true,name,type,emoji:{main:'🍽️',side:'🥗',soup:'🥣',one:'🍚'}[type],
        time:Math.max(1,parseInt(b.querySelector('#rtm').value)||20),serv:norm(b.querySelector('#rsv').value),

      S.my=S.my||[]; const i=S.my.findIndex(x=>x.id===rec.id); if(i>=0) S.my[i]=rec; else S.my.push(rec);
      save(); refreshRecipes(); toast('レシピを保存しました'); RT='mine'; TAB='recipes'; render(); openRecipe(rec.id);
    };

// ---------- レシピの共有（データをリンクの # 以降に入れて送る。サーバーは使わない） ----------
const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}};
async function pipe(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer())}
const packRecipe=r=>({n:r.name,t:r.type,m:r.time,v:r.serv||'',i:r.ing.map(x=>[x[3]||x[0].replace(/^\?/,''),x[1]||'',x[2]?1:0]),s:r.seas,p:r.steps,u:r.src||''});
function unpackRecipe(o){
  const type=TYPE_LABEL[o.t]?o.t:'main';
  return {id:'u_'+uid(),t:Date.now(),mine:true,name:String(o.n||'レシピ').slice(0,60),type,emoji:{main:'🍽️',side:'🥗',soup:'🥣',one:'🍚'}[type],time:+o.m||20,serv:String(o.v||''),
    ing:(o.i||[]).map(([n,a,opt])=>{const x=ingFromLine(String(n)+' '+String(a||''));if(!x)return null;if(opt)x[2]=1;return x}).filter(Boolean),
    seas:(o.s||[]).map(String),steps:(o.p||[]).map(String),src:/^https?:\/\//.test(o.u||'')?o.u:''};
}
async function shareURL(recipes){
  const u8=new TextEncoder().encode(JSON.stringify(recipes.map(packRecipe)));
  let code;
  try{code='z'+b64u.enc(await pipe(u8,new CompressionStream('deflate-raw')))}catch(e){code='j'+b64u.enc(u8)}
  return location.href.split('#')[0]+'#r='+code;
}
async function readShare(str){
  const m=String(str).match(/#r=([zj])([A-Za-z0-9_-]+)/); if(!m) return null;
  let u8=b64u.dec(m[2]); if(m[1]==='z') u8=await pipe(u8,new DecompressionStream('deflate-raw'));
  const arr=JSON.parse(new TextDecoder().decode(u8)); return Array.isArray(arr)?arr.map(unpackRecipe):null;
}
async function shareRecipes(recipes){
  const url=await shareURL(recipes);
  const title=recipes.length===1?`レシピ「${recipes[0].name}」`:`マイレシピ ${recipes.length}品`;
  if(navigator.share){try{await navigator.share({title,text:title+'（冷蔵庫ごはん）',url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('共有リンクをコピーしました');return}catch(e){}
  openSheet('共有リンク',`<p class="muted">このリンクをコピーして送ってください。</p><textarea rows="6" readonly>${esc(url)}</textarea>`,b=>{const t=b.querySelector('textarea');t.focus();t.select()});
}

    <button class="btn block" id="imok" style="margin-top:16px">マイレシピに追加</button>`,b=>{

      const add=[...b.querySelectorAll('input:checked')].map(x=>list[+x.dataset.i]);

async function checkShareHash(){
  if(!location.hash.startsWith('#r=')) return;
  const h=location.hash; history.replaceState(null,'',location.href.split('#')[0]);
  try{const list=await readShare(h); if(list&&list.length) openImport(list); else toast('レシピを読み込めませんでした')}catch(e){toast('レシピを読み込めませんでした')}
}

// ---------- 家族で同期（Firebase Firestore） ----------
// homes/{家族コード}/items|recipes|hist/{id} に1件ずつ保存し、全員の端末でリアルタイムに同じにする
const FB_CONFIG={apiKey:"AIzaSyDegPdxMuktMR1DfipeM5EncLPoK9_8Sz0",authDomain:"fridge-app-cc09f.firebaseapp.com",projectId:"fridge-app-cc09f",storageBucket:"fridge-app-cc09f.firebasestorage.app",messagingSenderId:"819072255455",appId:"1:819072255455:web:8cf28e30f449a0e426b06a"}; // 公開用の設定値（守りはFirestoreのルールで行う）
const FB_VER='10.12.2';
const SYNC_LS='fridge_sync_v1';
const SY={code:null,cfg:null,merge:false,status:'off',err:'',ready:{},remote:{items:{},recipes:{},hist:{}},fb:null,db:null,unsub:[]};
try{Object.assign(SY,JSON.parse(localStorage.getItem(SYNC_LS)||'{}'))}catch(e){}
function saveSync(){try{localStorage.setItem(SYNC_LS,JSON.stringify({code:SY.code,cfg:SY.cfg,merge:SY.merge}))}catch(e){}}
const fbCfg=()=>FB_CONFIG||SY.cfg;
const SYNC_COLS={items:{get:()=>S.items,set:a=>S.items=a},recipes:{get:()=>S.my,set:a=>S.my=a},hist:{get:()=>S.hist,set:a=>S.hist=a}};
const syncOn=()=>SY.status==='on';
// Firestoreは配列の中の配列を保存できないので、材料は {k,a,o,l} の形にして送る
function cleanDoc(col,o){const c={...o};delete c.seasK;for(const k in c)if(c[k]===undefined)delete c[k];
  if(col==='recipes'&&Array.isArray(c.ing)) c.ing=c.ing.map(x=>Array.isArray(x)?{k:x[0],a:x[1]??'',o:x[2]?1:0,l:x[3]??''}:x);
  return c}
function fromDoc(col,d){if(col==='recipes'&&Array.isArray(d.ing)) d.ing=d.ing.map(x=>Array.isArray(x)?x:[x.k,x.a,x.o,x.l]);return d}
// キーの順番に左右されない比較用の文字列
function stableStr(v){return Array.isArray(v)?'['+v.map(stableStr).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}':JSON.stringify(v)}
async function loadFB(){
  if(window.__FBMOCK) return window.__FBMOCK;
  const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [a,u,f]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  return {...a,...u,...f};
}
function newHomeCode(){const c='abcdefghjkmnpqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint8Array(12));return [...r].map(x=>c[x%c.length]).join('')}
// 届いたデータで手元の配列を更新する（開いている画面が古い参照を持たないよう、同じオブジェクトを書き換える）
function applyRemote(col,map){
  const cur=SYNC_COLS[col].get(); const byId=new Map(cur.map(o=>[o.id,o]));
  let next=[];
  for(const [id,data] of Object.entries(map)){
    const o=byId.get(id);
    if(o){for(const k of Object.keys(o)) if(k!=='seasK'&&k!=='id'&&!(k in data)) delete o[k]; Object.assign(o,data); next.push(o)}
    else next.push({...data,id});
  }
  if(col==='recipes') next.sort((a,b)=>(b.t||0)-(a.t||0));
  if(col==='hist') next.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
  SYNC_COLS[col].set(next);
}
async function syncStart(){
  syncStop(true);
  if(!fbCfg()||!SY.code) return;
  SY.status='connecting'; SY.err=''; SY.ready={}; SY.remote={items:{},recipes:{},hist:{}}; renderSyncBits();
  try{
    const fb=SY.fb=await loadFB();
    let app; try{app=fb.getApp('fridge')}catch(e){app=fb.initializeApp(fbCfg(),'fridge')}
    await fb.signInAnonymously(fb.getAuth(app));
    const db=SY.db=fb.getFirestore(app);
    for(const col of Object.keys(SYNC_COLS)){
      const pendingLocal=SYNC_COLS[col].get().map(o=>({...o}));
      SY.unsub.push(fb.onSnapshot(fb.collection(db,'homes',SY.code,col),snap=>{
        const map={}; snap.forEach(d=>{map[d.id]=d.data()});
        SY.remote[col]=Object.fromEntries(Object.entries(map).map(([k,v])=>{const c={...v};delete c.id;return [k,stableStr(c)]}));
        if(!SY.ready[col]){
          SY.ready[col]=true;
          // 参加時に「この端末のデータも追加」を選んだら、手元にしかないものを足す
          if(SY.merge) for(const o of pendingLocal) if(o.id&&!map[o.id]) map[o.id]=cleanDoc(col,o);
        }
        for(const k in map) map[k]=fromDoc(col,{...map[k]});
        applyRemote(col,map);
        if(col==='recipes') refreshRecipes();
        if(Object.keys(SYNC_COLS).every(c=>SY.ready[c])){
          if(SY.status!=='on'){SY.status='on'; if(SY.merge){SY.merge=false;saveSync()}}
          saveLocal(); syncPush();
        }
        render();
      },e=>syncFail(e)));
    }
  }catch(e){syncFail(e)}
}
function syncFail(e){
  console.error(e); SY.status='error';
  SY.err=/permission/i.test(String(e&&(e.code||e.message)))?'読み書きが許可されていません（Firestoreのルールか匿名ログインの設定を確認してください）':
    (navigator.onLine===false?'オフラインです':'接続できませんでした：'+String(e&&(e.code||e.message)||e).slice(0,80));
  renderSyncBits();
}
function syncStop(keepCode){
  for(const u of SY.unsub) try{u()}catch(e){}
  SY.unsub=[]; SY.status='off'; SY.ready={};
  if(!keepCode){SY.code=null;saveSync()}
}
// 手元とクラウドの差分だけを書き込む
function syncPush(){
  if(!syncOn()||!SY.db) return;
  const fb=SY.fb; let batch=fb.writeBatch(SY.db), n=0; const commits=[];
  const put=(fn)=>{fn(batch); if(++n>=450){commits.push(batch.commit());batch=fb.writeBatch(SY.db);n=0}};
  for(const col of Object.keys(SYNC_COLS)){
    const local={};
    for(const o of SYNC_COLS[col].get()){ if(!o.id) o.id=uid(); const d=cleanDoc(col,o); delete d.id; local[o.id]=[stableStr(d),d] }
    const remote=SY.remote[col];
    for(const [id,[j,d]] of Object.entries(local)) if(remote[id]!==j){ const ref=fb.doc(SY.db,'homes',SY.code,col,id); put(b=>b.set(ref,d)); remote[id]=j }
    for(const id of Object.keys(remote)) if(!(id in local)){ const ref=fb.doc(SY.db,'homes',SY.code,col,id); put(b=>b.delete(ref)); delete remote[id] }
  }
  if(n) commits.push(batch.commit());
  Promise.all(commits).catch(syncFail);
}
function renderSyncBits(){ if(TAB==='more') renderMore(); const h=$('#hdrSub'); if(h) render() }
function syncLabel(){return {off:'',connecting:'・同期の接続中…',on:'・家族と同期中',error:'・同期エラー'}[SY.status]}
// firebaseConfig の貼り付け（JSでもJSONでも読めるように）
function parseFbConfig(t){
  const o={}; for(const m of String(t).matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g)) o[m[1]]=m[2];
  return o.apiKey&&o.projectId&&o.appId?o:null;
}
function inviteURL(){
  let u=location.href.split(/[?#]/)[0]+'?home='+SY.code;
  if(!FB_CONFIG&&SY.cfg) u+='#cfg='+b64u.enc(new TextEncoder().encode(JSON.stringify(SY.cfg)));
  return u;
}
async function sendInvite(){
  const url=inviteURL(), text='冷蔵庫ごはんの家族グループへの招待です。リンクを開いて「参加する」を押してください。';
  if(navigator.share){try{await navigator.share({title:'冷蔵庫ごはん 家族の招待',text,url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('招待リンクをコピーしました');return}catch(e){}
  openSheet('招待リンク',`<textarea rows="5" readonly>${esc(url)}</textarea>`);
}
function openJoin(code){
  const hasLocal=S.items.length+(S.my||[]).length>0;
  openSheet('家族のグループに参加',`
    <p>家族コード <b>${esc(code)}</b> のグループに参加します。参加すると、食材リスト・マイレシピ・作った記録が家族全員で同じになります。</p>
    ${hasLocal?`<label class="check"><input type="checkbox" id="jm" checked><span>この端末に登録済みの食材・レシピも、グループに追加する<br><span class="muted">外すと、この端末の今のデータはグループの内容に置き換わります</span></span></label>`:''}
    <button class="btn block" id="jok" style="margin-top:16px">参加する</button>`,b=>{
    b.querySelector('#jok').onclick=()=>{const m=b.querySelector('#jm');SY.code=code;SY.merge=m?m.checked:false;saveSync();closeSheet();toast('参加しました');syncStart()};
  });
}
function openSyncSetup(){
  openSheet('Firebaseの設定',`
    <p class="muted">Firebaseのプロジェクト設定にある <code>firebaseConfig</code> の中身（apiKey〜appId）をそのまま貼り付けてください。</p>
    <textarea id="fc" rows="9" placeholder='apiKey: "AIza...",&#10;authDomain: "....firebaseapp.com",&#10;projectId: "...",&#10;storageBucket: "...",&#10;messagingSenderId: "...",&#10;appId: "..."'>${SY.cfg?esc(JSON.stringify(SY.cfg,null,1)):''}</textarea>
    <button class="btn block" id="fcok" style="margin-top:12px">保存</button>`,b=>{
    b.querySelector('#fcok').onclick=()=>{const c=parseFbConfig(b.querySelector('#fc').value);if(!c){toast('apiKey・projectId・appId が見つかりません');return}
      SY.cfg=c;saveSync();closeSheet();toast('保存しました');if(SY.code)syncStart();else render()};
  });
}
function syncCardHTML(){
  if(!fbCfg()) return `<div class="card" style="padding:12px 14px"><p class="muted" style="margin-top:0">家族のスマホと、食材リスト・マイレシピ・作った記録を同じにできます。使うにはFirebase（Googleの無料データベース）の設定が必要です。</p><button class="btn sub block" id="fbset">Firebaseの設定を貼り付ける</button></div>`;
  if(!SY.code) return `<div class="card" style="padding:12px 14px"><p class="muted" style="margin-top:0">家族のスマホと、食材リスト・マイレシピ・作った記録をリアルタイムで同じにできます。</p>
    <button class="btn block" id="mkhome">家族のグループを作る</button>

    <p class="muted">やめても、この端末には今のデータが残ります。</p></div>`;
}
function bindSyncCard(){
  const on=(id,f)=>{const e=$('#'+id); if(e) e.onclick=f};
  on('fbset',openSyncSetup);
  on('mkhome',()=>{SY.code=newHomeCode();SY.merge=true;saveSync();toast('家族のグループを作りました');syncStart()});
  on('jgo',()=>{const c=norm($('#jcode').value).toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length<12){toast('家族コードは12文字です');return}openJoin(c)});
  on('invite',sendInvite);
  on('retry',syncStart);
  on('leave',()=>{if(confirm('家族との同期をやめますか？（この端末のデータは残ります）')){syncStop();toast('同期をやめました');render()}});
}
function checkInvite(){
  const q=new URLSearchParams(location.search); const code=(q.get('home')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const cm=location.hash.match(/#cfg=([A-Za-z0-9_-]+)/);
  if(!code&&!cm) return;
  if(cm&&!FB_CONFIG){try{const c=JSON.parse(new TextDecoder().decode(b64u.dec(cm[1])));if(c.apiKey){SY.cfg=c;saveSync()}}catch(e){}}
  history.replaceState(null,'',location.href.split(/[?#]/)[0]);
  if(code.length>=12&&code!==SY.code&&fbCfg()) openJoin(code);
}
